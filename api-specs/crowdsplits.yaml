    CountryResponse:
      type: object
      description: |
        A country known to CrowdSplit, with a flag indicating whether KYC is
        currently supported (Stripe Connect card-payments capability + Bridge
        allowed). Source list: RCS-453.
      required:
        - iso_alpha_2
        - name
        - kyc_supported
      properties:
        iso_alpha_2:
          type: string
          description: ISO 3166-1 alpha-2 country code (two uppercase letters).
          example: US
        name:
          type: string
          description: Country display name.
          example: United States
        kyc_supported:
          type: boolean
          description: |
            True when CrowdSplit currently accepts this country for KYC
            (mutual Stripe ∩ Bridge support).
    WebhookEnvelope:
      type: object
      description: |
        Base envelope delivered to merchant webhook endpoints. Every webhook
        request body has the shape `{ id, event, category, data }`; concrete
        event schemas compose this base via `allOf` and refine `event` /
        `category` to their `const` values and `data` to a specific schema.

        Each delivery carries three headers:
          CrowdSplit-Signature        `t={unix-ts},v1={hex-hmac-sha256}`
          CrowdSplit-Timestamp        seconds since epoch
          CrowdSplit-Notification-Id  unique per delivery (idempotency)

        Merchants MUST verify the HMAC of the raw body using the webhook
        secret returned at registration, and SHOULD reject the delivery if
        `CrowdSplit-Timestamp` differs from the current time by more than
        5 minutes. Duplicate `CrowdSplit-Notification-Id` values indicate a
        retry of a previously dispatched delivery and should be deduplicated.
      required:
        - id
        - event
        - category
        - data
      properties:
        id:
          type: string
          format: uuid
          description: Unique notification ID (stable across retry attempts).
        event:
          type: string
          description: Event name; specialized via `allOf` per operation (e.g. `payment.succeeded`).
        category:
          type: string
          description: Event category; specialized via `allOf` per operation (e.g. `payment_lifecycle`).
        data:
          type: object
          description: Event-specific payload; each operation refines this via `allOf` to a concrete schema.
    ProviderName:
      type: string
      description: |
        CrowdSplit-managed upstream provider identifier. Lowercased in every
        merchant-facing payload; the internal enum keys are defined in `util/enum/PLATFORMS.js`.

        Note: merchant-facing `*.provider` fields receive a special
        transform (`util/helper.js:314-326`) that emits `avenia` in place
        of `brla` in the lowercased form; consumers should treat the two
        as equivalent for now.
      enum:
        - stripe
        - bridge
        - wallet_service
        - crowd_split
    TransactionStatus:
      type: string
      description: |
        Transaction lifecycle status (lowercased on the wire). Source of
        truth: `util/enum/TRANSACTION_STATUS.js`.
      enum:
        - created
        - awaiting_confirmation
        - processing
        - captured
        - succeeded
        - failed
        - canceled_after_completion
        - canceled
    WebhookTransactionData:
      type: object
      description: Data payload for payment, refund, transfer, buy, sell, payout, and external events
      required:
        - id
        - provider
        - status
        - source
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Transaction unique ID
        provider:
          $ref: '#/components/schemas/ProviderName'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        source:
          type: object
          description: Source details (amount, currency, customer, payment_method).
          properties:
            amount:
              type: integer
              description: Amount in minor units (cents).
            currency:
              type: string
              description: ISO 4217 currency code (lowercased on the wire).
            customer:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Customer (subject) unique ID.
            payment_method:
              type: object
              description: Payment method used on the source leg. Extra keys vary by provider.
              properties:
                id:
                  type: string
                  format: uuid
                  description: Payment method unique ID.
                type:
                  type: string
                  description: Payment method type (lowercased — card, pix, bank, …).
                chain:
                  type: string
                  description: Blockchain network when the method is on-chain (lowercased).
              additionalProperties: true
            capture_method:
              type: string
              description: Capture strategy (lowercased — e.g. automatic, manual).
            fraud_check:
              type: object
              description: |
                Fraud-check configuration and result (when applicable). Present
                only on transaction types that route through fraud screening.
              properties:
                provider:
                  type: string
                  description: Fraud-check provider identifier (lowercased).
                config:
                  type: object
                  properties:
                    threshold:
                      type: string
                      description: Fraud score threshold applied (lowercased identifier).
                    sequence:
                      type: string
                      description: Sequence strategy identifier (lowercased).
              additionalProperties: true
        destination:
          type: object
          description: Destination details (if applicable).
          nullable: true
          properties:
            amount:
              type: integer
              description: Amount in minor units (cents).
            currency:
              type: string
              description: ISO 4217 currency code (lowercased).
            customer:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Destination customer (subject) unique ID.
            payment_method:
              type: object
              description: Payment method used on the destination leg.
              properties:
                id:
                  type: string
                  format: uuid
                type:
                  type: string
                  description: Payment method type (lowercased).
                chain:
                  type: string
                  description: Blockchain network (lowercased).
              additionalProperties: true
        fee:
          type: object
          nullable: true
          description: |
            Platform / provider fee charged on this transaction, when present.
            Shape originates from the merchant's request body (see e.g.
            `factory/payment/card/StripeCardHandler.js`).
          properties:
            bearer:
              type: string
              description: |
                Who bears the fee. Stripe connected-account flows require
                `connected_account`; may be absent for other providers or
                flow types.
            amount:
              type: integer
              description: Fee amount in minor units (cents).
            currency:
              type: string
              description: Fee currency (lowercased).
          additionalProperties: true
        reference_transaction_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Parent transaction ID (for refunds)
        total_installments:
          type:
            - integer
            - 'null'
        installments:
          type:
            - array
            - 'null'
          items:
            type: object
            properties:
              number:
                type: integer
              amount:
                type: integer
              status:
                type: string
              settlement_date:
                type: string
                format: date-time
        settlement_date:
          type:
            - string
            - 'null'
          format: date-time
        metadata:
          type: object
          nullable: true
          description: |
            Merchant-supplied arbitrary metadata, echoed back unchanged.
            Shape is defined by the merchant at request time.
          additionalProperties: true
        provider_response:
          type: object
          nullable: true
          description: |
            Raw excerpt of the upstream provider's response. Key set varies
            by provider and by call — do not rely on specific keys. Useful
            for debugging and for forwarding provider-specific error codes.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookDisputeData:
      type: object
      description: Data payload for dispute events
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Dispute unique ID
        status:
          type: string
        evidence_due_by:
          type:
            - string
            - 'null'
          format: date-time
        evidences:
          type: array
          description: |
            Attached dispute evidence records. Shape follows the merchant's
            submission via `POST /api/v1/disputes/{dispute_id}/evidence`;
            keys match those accepted by that endpoint.
          items:
            type: object
            additionalProperties: true
        payment:
          type: object
          description: Associated payment transaction (summary fields only).
          properties:
            id:
              type: string
              format: uuid
              description: Payment transaction UID.
            type:
              type: string
              description: Transaction type (lowercased — e.g. `payment`).
            status:
              type: string
              description: Payment's current status (lowercased).
    WebhookProviderRegistrationData:
      type: object
      description: Data payload for customer, KYC, and provider registration events
      required:
        - id
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Customer unique ID
        status:
          type: string
          description: Registration status (lowercased)
        provider:
          $ref: '#/components/schemas/ProviderName'
        target_role:
          type: string
          description: Target role (lowercased)
        provider_response:
          type: object
          nullable: true
          description: |
            Raw excerpt of the provider's registration response. Shape
            varies by provider — do not rely on specific keys.
          additionalProperties: true
        failure_reason:
          type:
            - string
            - 'null'
        readiness:
          type:
            - string
            - 'null'
          description: Provider readiness status
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookCustomerSyncData:
      type: object
      description: Data payload for customer sync events
      required:
        - id
        - provider
        - fields
        - attempt_id
      properties:
        id:
          type: string
          format: uuid
          description: Customer unique ID
        provider:
          $ref: '#/components/schemas/ProviderName'
        fields:
          type: array
          items:
            type: string
          description: Fields being synced
        attempt_id:
          type: string
          description: Sync attempt identifier
        synced_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp of successful sync (only on success)
        provider_data:
          type: object
          nullable: true
          description: |
            Data returned from the provider (only on success). Shape varies
            by provider — do not rely on specific keys.
          additionalProperties: true
        error:
          type:
            - string
            - 'null'
          description: Error message (only on failure)
    PaymentMethodType:
      type: string
      description: |
        Payment-method type identifier (lowercased). Source:
        `util/enum/subject/SUBJECT_PAYMENT_METHOD_TYPE.js`.
      enum:
        - bank
        - card
        - plaid
        - virtual_account
        - liquidation_address
        - trading_wallet
        - customer_wallet
        - pix
        - evm_address
    WebhookPaymentMethodData:
      type: object
      description: Data payload for payment method events
      required:
        - id
        - customer_id
        - provider
        - status
        - type
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Payment method unique ID
        customer_id:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/ProviderName'
        status:
          type: string
          description: Payment method status (lowercased)
        type:
          $ref: '#/components/schemas/PaymentMethodType'
        country:
          type:
            - string
            - 'null'
        chain:
          type:
            - string
            - 'null'
        currency:
          type:
            - string
            - 'null'
        bank_account_type:
          type:
            - string
            - 'null'
        metadata:
          type: object
          nullable: true
          description: |
            Merchant-supplied arbitrary metadata for the payment method.
            Shape is defined by the merchant at registration.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: Validation error message
            data: null
    UnauthorizedError:
      description: Authentication credentials are missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: Unauthorized
            data: null
    ForbiddenError:
      description: Authenticated but not authorized for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: Forbidden
            data: null
    NotFoundError:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: Resource not found
            data: null
  parameters:
    RefAppKeyHeader:
      name: Ref-App-Key
      in: header
      required: false
      description: App key for subscription service authentication
      schema:
        type: string
    PaymentTypeHeader:
      name: Payment-Type
      in: header
      required: false
      description: Set to 'recurring_payment' for subscription payment flows
      schema:
        type: string
        enum:
          - recurring_payment
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Number of records to return per page
      schema:
        type: integer
        minimum: 1
        default: 10
    OffsetQuery:
      name: offset
      in: query
      required: false
      description: Number of records to skip
      schema:
        type: integer
        minimum: 0
        default: 0
    CrowdSplitSignatureHeader:
      name: CrowdSplit-Signature
      in: header
      required: true
      description: |
        HMAC-SHA256 signature over the raw request body, signed with the
        merchant's webhook secret. Format: `t={unix-ts},v1={hex-hmac}`.
      schema:
        type: string
        example: t=1713456789,v1=a1b2c3d4e5f6abcdef1234567890abcdef1234567890abcdef1234567890abcd
    CrowdSplitTimestampHeader:
      name: CrowdSplit-Timestamp
      in: header
      required: true
      description: |
        Unix timestamp (seconds since epoch) at dispatch. Merchants should
        reject the delivery if the skew against their own clock exceeds
        5 minutes, to limit replay windows.
      schema:
        type: integer
        example: 1713456789
    CrowdSplitNotificationIdHeader:
      name: CrowdSplit-Notification-Id
      in: header
      required: true
      description: |
        Unique delivery ID. Stable across retries of the same logical event
        — use it to deduplicate idempotently on receipt.
      schema:
        type: string
        format: uuid
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  headers: {}
x-tagGroups:
  - name: Authentication
    tags:
      - Auth
  - name: Merchant Account
    tags:
      - Merchants
      - Subscriptions
      - Webhooks
  - name: Customers & KYC
    tags:
      - Customers
      - Payment Methods
      - Provider Registration
  - name: Payment Flows
    tags:
      - Payments
      - Payouts
      - Transfers
      - Buy / Sell
      - Wallets
  - name: Operations
    tags:
      - Transactions
      - Disputes
      - Tax
      - Files
      - Generic
      - System
  - name: Webhook Catalog
    tags:
      - Webhook Events
