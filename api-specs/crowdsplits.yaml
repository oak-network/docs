  /api/v1/subscription/{subscriptionId}/payment:
    post:
      operationId: initiateSubscriptionPayment
      summary: Initiate subscription payment
      description: |
        Manually initiate a payment for a subscription.

        **Authentication.** Merchant `bearerAuth` only — the route is
        guarded by `merchantMiddleware.verifyMerchantToken`
        (`route/subscriptionRoute.js:74-80`). The subscription-service
        dispatcher uses a different entry path that performs `Ref-App-Key`
        validation via `subscriptionMiddleware.verifySubscriptionServiceRequest`;
        that path is not this operation.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          description: Subscription hash ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - payment_method_id
                - payment_method_type
                - payment_method_provider
              properties:
                customer_id:
                  type: string
                  format: uuid
                payment_method_id:
                  type: string
                  format: uuid
                payment_method_type:
                  type: string
                  enum:
                    - CARD
                payment_method_provider:
                  type: string
                  enum: []
      responses:
        '200':
          description: Payment initiated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                          status:
                            type: string
                          sub_status:
                            type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
