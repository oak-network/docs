        - bearerAuth: []
      parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Comma-separated statuses (active, pending_activation, canceled, expired, queued)
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            maximum: 100
        - name: page_no
          in: query
          schema:
            type: integer
            minimum: 1
