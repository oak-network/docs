      summary: Submit dispute for review
      description: Mark the dispute as final and submit it to the provider for review.
      tags:
        - Disputes
      security:
        - bearerAuth: []
      parameters:
        - name: dispute_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dispute submitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DisputeResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/disputes/{dispute_id}/close:
    put:
      operationId: closeDispute
      summary: Close a dispute
      description: |
        Close the dispute by accepting the provider's outcome. Used when
        the merchant chooses not to contest (or to stop contesting). Once
        closed the dispute state is terminal — subsequent evidence uploads
        are no-ops. For the final funds-movement state, listen for the
        `payment.dispute.funds_withdrawn` or
        `payment.dispute.funds_reinstated` webhook event.
      tags:
        - Disputes
      security:
        - bearerAuth: []
      parameters:
        - name: dispute_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dispute closed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DisputeResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/subscription/plans:
    get:
      operationId: listPlans
      summary: List subscription plans
      description: Retrieve all subscription plans for the merchant.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Plan list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlanResponse'
    post:
      operationId: createPlan
      summary: Create a subscription plan
      description: |
        Define a recurring-payment plan template. `price` must be between
        100 and 10_000 and `currency` must be `USD`
        (`services/subscriptionService.js:18-29`). Plans are not eligible
        for subscriptions until they are published via
        `PATCH /api/v1/subscription/plans/{planId}/publish`.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
            example:
              name: Monthly Pro
              description: Monthly professional plan
              frequency: 30
              price: 2999
              currency: USD
              created_by: admin@example.com
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      msg:
                        example: plan created
                      data:
                        type: string
                        description: Plan hash ID
  /api/v1/subscription/plans/{planId}:
    get:
      operationId: getPlan
      summary: Get plan details
      description: Retrieve details of a specific subscription plan.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plan details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PlanResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updatePlan
      summary: Update a plan
      description: Update plan properties. All fields are optional.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '200':
          description: Plan updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      msg:
                        example: plan updated
                      data:
                        type: string
                        description: Plan hash ID
    delete:
      operationId: deletePlan
      summary: Delete a plan
      description: |
        Soft-delete a subscription plan. The record is retained so that
        existing subscribers continue through their current billing cycle
        with the plan's snapshotted terms; no new subscriptions can
        reference the plan after deletion. Hard removal requires ops
        intervention.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plan deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
