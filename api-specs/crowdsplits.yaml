        External deposit succeeded. Emitted during the external-deposit lifecycle
        (funds arriving from outside CrowdSplit, e.g., a bank wire or on-chain
        transfer to a virtual account). Payload is a `WebhookTransactionData` with
        `type: external_deposit`; reconcile against bank or on-chain records.
      operationId: webhookExternalDepositSucceeded
      tags:
        - Webhook Events
      parameters:
        - $ref: '#/components/parameters/CrowdSplitSignatureHeader'
        - $ref: '#/components/parameters/CrowdSplitTimestampHeader'
        - $ref: '#/components/parameters/CrowdSplitNotificationIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event:
                      const: external.deposit.succeeded
                    category:
                      const: externally_lifecycle
                    data:
                      $ref: '#/components/schemas/WebhookTransactionData'
      responses:
        '200':
          description: Webhook acknowledged
  external.virtual_account.funded:
    post:
      summary: External virtual account funded
      description: |
        External virtual account funded. Emitted when a virtual account assigned to a
        customer receives a deposit from outside the CrowdSplit platform. Payload
        identifies the receiving customer and the funding amount. This does not by
        itself credit a wallet — use `external.deposit.*` events for the subsequent
        credit lifecycle.
      operationId: webhookExternalVirtualAccountFunded
      tags:
        - Webhook Events
      parameters:
        - $ref: '#/components/parameters/CrowdSplitSignatureHeader'
        - $ref: '#/components/parameters/CrowdSplitTimestampHeader'
        - $ref: '#/components/parameters/CrowdSplitNotificationIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event:
                      const: external.virtual_account.funded
                    category:
                      const: externally_lifecycle
                    data:
                      $ref: '#/components/schemas/WebhookTransactionData'
      responses:
        '200':
          description: Webhook acknowledged
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Merchant authentication token. Obtained via POST /api/auth/token.
        Pass as: Authorization: Bearer <token>
    accessTokenAuth:
      type: apiKey
      in: header
      name: x-access-token
      description: |
        User JWT access token for user-level authentication.
        Used primarily for admin and internal operations.
    refAppKeyAuth:
      type: apiKey
      in: header
      name: Ref-App-Key
      description: |
        Subscription service authentication key.
        Used with Payment-Type: recurring_payment header for subscription payments.
  schemas:
    ApiResponse:
      type: object
      properties:
        msg:
          type: string
          description: Human-readable message describing the result
        data:
          description: Response payload (null on error)
      required:
        - msg
        - data
    ApiErrorResponse:
      type: object
      properties:
        msg:
          type: string
          description: Human-readable error message
        data:
          type: 'null'
          description: Always null for errors
        provider_message:
          type: string
          description: Optional error message from the underlying payment provider
      required:
        - msg
        - data
    BillingAddress:
      type: object
      properties:
        house_number:
          type: string
        street_number:
          type: string
        street_name:
          type: string
        postal_code:
          type: string
        city:
          type: string
        state:
          type: string
        country_code:
          type: string
    CreatePaymentRequest:
      type: object
      description: |
        Payment creation request. The exact schema varies by provider and payment method type.
        Fields like provider, currency, and type are case-insensitive (uppercased internally).
      required:
        - provider
        - source
      properties:
        provider:
          type: string
          description: Payment provider
          enum:
            - stripe
        source:
          type: object
          required:
            - amount
            - currency
            - payment_method
          properties:
            amount:
              type: integer
              minimum: 1
              description: Amount in smallest currency unit (e.g. cents)
            currency:
              type: string
              description: ISO 4217 currency code
              enum:
                - usd
                - brl
                - cop
                - jpy
            customer:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: CrowdSplit customer ID
            payment_method:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum:
                    - card
                id:
                  type: string
                  format: uuid
                  description: Saved payment method ID (for card payments)
                card_token:
                  type: string
                  description: One-time card token from provider
                expiry_date:
                  type: string
                  format: date-time
                  description: PIX QR code expiry (required for PIX payments)
                billing_address:
                  $ref: '#/components/schemas/BillingAddress'
            capture_method:
              type: string
              enum:
                - automatic
                - manual
              description: Whether to capture immediately or manually later
            fraud_check:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Fraud check is currently not available. Must be set to false.
            installments:
              type: integer
              minimum: 0
              description: Number of installments (Stripe)
            float_rate:
              type: number
              description: Float rate for installment payments (Stripe)
        destination:
          type: object
          description: Destination details for cross-currency or split payments
          properties:
            amount:
              type: integer
              minimum: 1
            currency:
              type: string
            customer:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
        fee:
          type: object
          description: Fee configuration for destination flow
          properties:
            bearer:
              type: string
              enum:
                - platform
                - connected_account
              default: platform
        flow:
          type: string
          enum:
            - platform
            - destination
          default: platform
          description: Payment flow type (Stripe)
        allocations:
          type: array
          description: Fund allocation splits (for platform flow)
          items:
            type: object
            properties:
              type:
                type: string
                default: uncategorized
              receiver:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - platform
                      - connected_account
                  id:
                    type: string
                    format: uuid
              amount:
                type: integer
                minimum: 1
        total_installments:
          type: integer
          minimum: 1
          description: Total installment count
        confirm:
          type: boolean
          description: Whether to auto-confirm the payment
        metadata:
          type: object
          description: |
            Merchant-supplied arbitrary metadata, stored with the
            transaction and echoed back on the response and on any
            derived webhook deliveries. Shape is defined by the merchant.
          additionalProperties: true
    PaymentResponse:
      type: object
      description: Payment transaction response object
      properties:
        id:
          type: string
          format: uuid
          description: Transaction unique ID
        status:
          type: string
          description: Current transaction status (lowercased in response)
          enum:
            - initiated
            - awaiting_confirmation
            - processing
            - captured
            - succeeded
            - failed
            - canceled
        type:
          type: string
          description: Transaction type (lowercased in response)
          enum:
            - payment
            - refund
        provider:
          type: string
          description: Payment provider (lowercased in response)
        source:
          type: object
          description: Source details (amount + currency + customer + payment method).
          properties:
            amount:
              type: integer
              description: Amount in minor units (cents).
            currency:
              type: string
              description: ISO 4217 currency code (lowercased on the wire).
            payment_method:
              type: object
              description: Payment method used on the source leg. Extra keys vary by provider.
              properties:
                id:
                  type: string
                  format: uuid
                  description: Payment method unique ID.
                type:
                  type: string
                  description: Payment method type (lowercased — card, pix, bank, …).
                chain:
                  type: string
                  description: Blockchain network when the method is on-chain (lowercased).
              additionalProperties: true
            customer:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Customer (subject) unique ID.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        settlement_date:
          type:
            - string
            - 'null'
          format: date-time
        metadata:
          type: object
          nullable: true
          description: |
            Merchant-supplied arbitrary metadata, echoed back unchanged on
            the response and on any derived webhook deliveries. Shape is
            defined by the merchant at request time.
          additionalProperties: true
    CreateMerchantRequest:
      type: object
      required:
