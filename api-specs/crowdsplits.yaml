                - payment_method_provider
                - fee_bearer
              properties:
                plan_id:
                  type: string
                  description: Plan hash ID
                source_customer_id:
                  type: string
                  format: uuid
                destination_customer_id:
                  type: string
                  format: uuid
                payment_method_id:
                  type: string
                  format: uuid
                payment_method_type:
                  type: string
                  enum:
                    - CARD
                payment_method_provider:
                  type: string
                  enum: []
                fee_bearer:
                  type: string
                  enum:
                    - connected_account
