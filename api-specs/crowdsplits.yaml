                      msg:
                        example: Subscription created successfully
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Subscription hash ID
                          status:
                            type: string
                            example: pending_activation
                          sub_status:
                            type: string
                            example: payment_init
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/subscription/subscriptions/{subscriptionId}/cancel:
    patch:
      operationId: cancelSubscription
      summary: Cancel a subscription
      description: |
        Cancel an active subscription by forwarding the request to the
        upstream subscription service
        (`services/subscriptionService.js:776-830`). Future billing cycles
        are skipped; already-captured payments are preserved and must be
        refunded separately via `POST /api/v1/payments/{id}/refund` if a
        refund is required.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscription cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Subscription cancelled successfully
                  data:
                    type: object
                    description: |
                      Pass-through response from the upstream subscription
                      service (see `services/subscriptionService.js:776-830`
                      for the forwarding logic). Shape is not contractually
                      stable; treat as opaque acknowledgement.
                    additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/subscription/list:
