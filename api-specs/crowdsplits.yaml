        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/providers/{provider}/proxy:
    post:
      operationId: genericProviderProxy
      summary: Generic provider proxy call
      description: |
        Proxy a request to a specific payment provider's API.
        The endpoint and request body must be whitelisted in the merchant's configuration.
      tags:
        - Generic
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Provider name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific request body (varies by provider and endpoint)
              additionalProperties: true
      responses:
        '200':
          description: Provider response (pass-through)
          content:
            application/json:
              schema:
                type: object
                description: |
                  Provider-specific response, passed through verbatim from
                  the upstream provider's API. Shape varies by `provider`
                  and by the specific endpoint being proxied — consult the
