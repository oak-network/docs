      description: Mark a transaction as settled. Requires app-key authentication.
      tags:
        - Transactions
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Transaction UID
          schema:
            type: string
            format: uuid
        - name: app-key
          in: header
          required: true
