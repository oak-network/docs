                    description: |
                      Tax calculation result. Echoes the request body fields
                      and adds a `provider_response` object containing the
                      raw tax-provider reply
                      (`services/paymentService.js:1148`). Exact keys inside
                      `provider_response` vary per provider.
                    properties:
                      provider:
                        type: string
