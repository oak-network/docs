      tags:
        - Disputes
      security:
        - bearerAuth: []
      parameters:
        - name: dispute_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file_evidences:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - type
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: File ID
                      type:
                        type: string
                        enum:
                          - receipt
                          - customer_signature
                          - shipping_documentation
                          - service_documentation
                          - refund_policy
                          - cancellation_policy
                          - uncategorized_file
                text_evidences:
                  type: array
                  items:
                    type: object
                    required:
                      - key
                      - value
                    properties:
                      key:
                        type: string
                        enum:
                          - customer_name
                          - customer_email_address
                          - customer_purchase_ip
                          - product_description
                          - duplicate_charge_id
                          - enhanced_evidence
                          - customer_communication
                          - refund_policy
                          - refund_policy_disclosure
                          - refund_refusal_explanation
                          - service_date
                          - shipping_address
                          - shipping_carrier
                          - shipping_date
                          - shipping_tracking_number
                          - shipping_tracking_url
                          - duplicate_charge_explanation
                          - cancellation_policy
                          - cancellation_rebuttal
                          - uncategorized_text
                      value:
                        type:
                          - string
                          - 'null'
      responses:
