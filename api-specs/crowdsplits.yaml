    post:
      operationId: populateKycData
      summary: Submit platform registration data
      description: Submit KYC/provider registration data for a customer on a specific provider platform.
      tags:
        - Provider Registration
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - target_role
              properties:
                provider:
                  type: string
                  description: Provider name (case-insensitive)
                target_role:
                  type: string
                  description: Target role for the provider registration
              additionalProperties: true
      responses:
        '200':
          description: Platform data submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                  data:
                    type: array
                    description: |
                      Registration status for this customer across every
                      provider they are registered on, one entry per
                      `(provider, target_role)` pair. Same shape as
                      `GET /api/v1/provider-registration/{customer_id}/status`.
                    items:
                      type: object
                      properties:
                        provider:
                          type: string
                          description: Provider name (lowercased).
                        target_role:
                          type: string
                          description: Target role on this provider (lowercased).
                        status:
                          type: string
                          description: Current registration status (lowercased).
                        readiness:
                          type: object
                          nullable: true
                          description: Provider-specific readiness flags (JSONB pass-through).
                          additionalProperties: true
                        rejection_reason:
                          type: string
                          nullable: true
                          description: Human-readable rejection reason when rejection-like.
                      additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/transactions:
    get:
      operationId: listTransactions
      summary: List transactions
      description: |
        Retrieve a paginated list of transactions for the merchant.
        Query filter values are case-insensitive (uppercased internally).
        Response fields status, type, provider, currency, payment_method are returned lowercased.
      tags:
        - Transactions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - name: type_list
          in: query
          description: Comma-separated transaction types (case-insensitive)
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status (case-insensitive)
          schema:
            type: string
        - name: payment_method
          in: query
          description: Filter by payment method type (case-insensitive)
          schema:
            type: string
        - name: source_currency
          in: query
          description: Filter by source currency (case-insensitive)
          schema:
            type: string
        - name: destination_currency
          in: query
          description: Filter by destination currency (case-insensitive)
          schema:
            type: string
        - name: provider
          in: query
          description: Filter by provider (case-insensitive)
          schema:
            type: string
      responses:
        '200':
          description: Transaction list
          headers:
            X-Limit-Requested:
              schema:
                type: integer
            X-Limit-Applied:
              schema:
                type: integer
            X-Offset-Requested:
              schema:
                type: integer
            X-Offset-Applied:
              schema:
                type: integer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count:
                            type: integer
                          transaction_list:
                            type: array
                            items:
                              $ref: '#/components/schemas/TransactionResponse'
  /api/v1/transactions/{id}:
