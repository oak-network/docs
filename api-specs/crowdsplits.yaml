                      description: Destination provider (for inter-platform transfers)
                    customer:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                    payment_method:
                      type: object
                      properties:
                        type:
                          type: string
                        id:
                          type: string
                          format: uuid
                        currency:
                          type: string
                        chain:
                          type: string
                metadata:
                  type: object
                  description: Custom metadata
                  additionalProperties: true
