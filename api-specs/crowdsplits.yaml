          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WebhookResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook
      description: |
        Remove a registered webhook URL. New events for this merchant
        will no longer be dispatched to the deleted URL. Notifications
        already queued on the broker at the moment of deletion continue
        through their retry schedule until acknowledged or exhausted —
        the delete does not purge in-flight deliveries.
      tags:
        - Webhooks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
