  /api/v1/countries:
    get:
      operationId: listCountries
      summary: List countries
      description: |
        Return the list of countries currently eligible for KYC onboarding
        (mutual Stripe ∩ Bridge support — Stripe Connect card-payments
        capability + Bridge allowed). Each entry is tagged with a
        `kyc_supported` boolean (always `true` in the current response). The
        list is open — no authentication required.

