              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - countries
                        properties:
                          countries:
                            type: array
                            items:
                              $ref: '#/components/schemas/CountryResponse'
