                - type: object
                  properties:
                    event:
                      const: external.deposit.awaiting_confirmation
                    category:
                      const: externally_lifecycle
                    data:
                      $ref: '#/components/schemas/WebhookTransactionData'
      responses:
        '200':
          description: Webhook acknowledged
  external.deposit.completed:
    post:
      summary: External deposit completed
      description: |
        External deposit completed. Emitted during the external-deposit lifecycle
        (funds arriving from outside CrowdSplit, e.g., a bank wire or on-chain
        transfer to a virtual account). Payload is a `WebhookTransactionData` with
        `type: external_deposit`; reconcile against bank or on-chain records.
      operationId: webhookExternalDepositCompleted
      tags:
