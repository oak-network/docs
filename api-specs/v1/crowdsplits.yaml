  /api/v1/providers/{provider}/proxy:
    post:
      operationId: genericProviderProxy
      summary: Generic provider proxy call
      description: |
        Proxy a request to a specific payment provider's API.
        The endpoint and request body must be whitelisted in the merchant's configuration.

        Transport-vs-semantic split (§10f.3): a HTTP 200 is returned whenever the
        proxy call itself succeeded — including when the upstream provider
        semantically rejected the request (a provider 4xx). In that case the
        response carries `data.provider_status` with the upstream 4xx and
        `data.provider_response` with the provider body. SDK callers MUST inspect
        `provider_status` before treating an HTTP 200 as success. Provider 5xx /
        unreachable / timeout return the canonical error envelope with a
        502/503/504 status.
      tags:
        - Generic
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Provider name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific request body (varies by provider and endpoint)
              additionalProperties: true
      responses:
        '200':
          description: Proxy call succeeded. `data.provider_status` carries the upstream provider HTTP status — 2xx on success, or a 4xx when the provider semantically rejected the request. Inspect `provider_status` before treating the response as success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProxyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/ProviderError'
        '503':
          $ref: '#/components/responses/ProviderUnavailableError'
        '504':
          $ref: '#/components/responses/ProviderUnavailableError'
  /api/admin/statuspage/maintenances:
    get:
      operationId: listStatuspageMaintenances
      summary: List scheduled maintenances
      description: |
        Returns all scheduled maintenances from Statuspage. Requires CS Admin
        or Owner role with the `statuspage:manage` permission.
      tags:
        - Statuspage
      security:
        - accessTokenAuth: []
      responses:
        '200':
          description: Maintenances fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MaintenanceResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      operationId: createStatuspageMaintenance
      summary: Schedule a maintenance window
      description: |
        Creates a scheduled maintenance on Statuspage for the specified
        components. Notifies subscribers automatically. Requires CS Admin
        or Owner role with the `statuspage:manage` permission.
      tags:
        - Statuspage
      security:
        - accessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - body
                - scheduledFor
                - scheduledUntil
                - components
              properties:
                name:
                  type: string
                  description: Short title for the maintenance window.
                  example: Scheduled DB migration
                body:
                  type: string
                  description: Detailed message shown to status-page subscribers.
                  example: Brief downtime expected during schema migration.
                scheduledFor:
                  type: string
                  format: date-time
                  description: ISO 8601 start time of the maintenance window.
                  example: '2026-07-20T02:00:00Z'
                scheduledUntil:
                  type: string
                  format: date-time
                  description: ISO 8601 end time of the maintenance window.
                  example: '2026-07-20T03:00:00Z'
                components:
                  type: array
                  description: Component keys to mark under maintenance.
                  items:
                    type: string
                    enum:
                      - api
                      - database
                      - messageQueue
                      - webhookDelivery
                      - stripe
                      - bridge
                  example:
                    - database
      responses:
        '201':
          description: Maintenance scheduled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MaintenanceResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/admin/statuspage/maintenances/{id}:
