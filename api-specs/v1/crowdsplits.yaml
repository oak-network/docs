          description: Webhook acknowledged
  external.deposit.received:
    post:
      summary: External deposit received
      description: |
        External deposit received. Emitted during the external-deposit lifecycle
        (funds arriving from outside CrowdSplit, e.g., a bank wire or on-chain
        transfer to a virtual account). Payload is a `WebhookTransactionData` with
        `type: external_deposit`; reconcile against bank or on-chain records.
      operationId: webhookExternalDepositReceived
