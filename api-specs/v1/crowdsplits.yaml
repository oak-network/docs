      responses:
        '200':
          description: Provider config saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MerchantProviderConfigSaveResult'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Merchant not approved, or missing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/merchant/{id}/platform-configs/{platform}:
    parameters:
      - name: id
        in: path
        required: true
        description: Public merchant UID
        schema:
          type: string
          format: uuid
      - name: platform
        in: path
        required: true
        description: Provider identifier
        schema:
          type: string
          enum:
