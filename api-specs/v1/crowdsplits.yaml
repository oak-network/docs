    WebhookResponse:
      type: object
      description: |
        Webhook registration record (wire shape, snake_case). The signing
        `secret` is NOT part of this shape — it is returned exactly once, at
        registration (§2.9.2); update/toggle/list/get responses never echo it.
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        event_types:
          type: array
          nullable: true
          items:
            type: string
          description: |
            Subscribed wire event values (see §2.9.7). `null` = subscribed to
            all events.
        created_at:
          type: string
          format: date-time
    RegisterWebhookRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          maxLength: 255
          description: Webhook endpoint URL
        description:
          type: string
          maxLength: 255
          description: Webhook description
        event_types:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            Wire event values this endpoint subscribes to
            (e.g. `payment.succeeded`). Omitted → subscribed to all events.
    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
        event_types:
          type:
            - array
            - 'null'
          minItems: 1
          items:
            type: string
          description: |
            Replaces the subscription list. Explicit `null` clears it back to
            "all events"; omitted leaves it unchanged.
    WebhookDeliveryAttempt:
      type: object
      description: One delivery attempt for a stored webhook notification (§2.9.9).
      required:
        - attempt
        - url
        - status_code
        - duration_ms
        - attempted_at
        - is_replay
        - replay_attempt_at
      properties:
        attempt:
          type: integer
          minimum: 1
          description: |
            1-indexed attempt number, contiguous per target URL; replays
            continue the numbering after the last live attempt.
        url:
          type: string
          description: |
            Target receiver URL. Additive vs the contract's single-endpoint
            model: one notification fans out to every subscribed endpoint.
        status_code:
          type:
            - integer
            - 'null'
          description: |
            HTTP status returned by the merchant endpoint; null when no
            response was received (timeout, network failure).
        duration_ms:
          type:
            - integer
            - 'null'
          description: Dispatch-to-response time in milliseconds; null on timeout.
        attempted_at:
          type: string
          format: date-time
        is_replay:
          type: boolean
          description: |
            True for attempts triggered via the replay endpoint; false for
            the original delivery and automatic retries.
        replay_attempt_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the replay was triggered; null on non-replay attempts.
    WebhookNotification:
      type: object
      description: |
        Stored webhook notification record returned by the merchant
        notifications endpoints. Field names are snake_case on the wire.
      required:
        - id
        - is_acknowledged
        - status
        - event
        - category
        - data
      properties:
        id:
          type: string
          pattern: ^(evt_)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: |
            Notification ID (`evt_<uuid>`; pre-cutover rows surface the bare
            UUID). Inputs dual-accept both forms.
        is_acknowledged:
          type: boolean
          description: Whether the merchant has acknowledged receipt
        status:
          type: string
          enum:
            - pending
            - delivered
            - dead_lettered
          description: |
            Aggregate delivery status (§2.9.9): `pending` while any receiver is
            still owed a delivery, `delivered` when every receiver got a 2xx,
            `dead_lettered` when the retry schedule is exhausted (recover via
            `?status=dead_lettered` + replay, §2.9.6 Path A).
        webhook_id:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            The webhook registration this notification was addressed to, when it
            fanned out to exactly one endpoint; null on multi-endpoint fan-out
            (use `delivery_attempts[].url`) and on rows predating the link.
        event:
          type:
            - string
            - 'null'
          description: |
            Event type (e.g. `payment.succeeded`). Null when the notification
            was recorded before the event taxonomy was applied.
        category:
          type:
            - string
            - 'null'
          description: |
            Webhook category (e.g. `payment`, `customer`). Null when not
            classified yet.
        data:
          description: |
            Original event payload as delivered to the merchant. Shape
            depends on `event` and `category`; see the webhook events
            section for the per-event payload shapes.
        endpoints:
          type: array
          items:
            type: string
          description: Receiver URLs this notification fanned out to.
        delivery_attempts:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryAttempt'
          description: |
            Every delivery attempt for this notification, oldest first
            (§2.9.9). Present on merchant-surface reads.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MerchantApiKey:
