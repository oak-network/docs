                file_evidences:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - type
                    properties:
                      id:
                        $ref: '#/components/schemas/FileId'
                        description: File ID (`file_<uuid>` or bare UUID — both accepted)
                      type:
                        type: string
                        enum:
                          - receipt
                          - customer_signature
                          - shipping_documentation
                          - service_documentation
                          - refund_policy
                          - cancellation_policy
                          - uncategorized_file
                text_evidences:
                  type: array
                  items:
                    type: object
                    required:
                      - key
