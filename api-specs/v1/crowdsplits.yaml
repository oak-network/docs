                    alias of `type`; emitted alongside `type` with the same value.
                chain:
                  type: string
                  description: Blockchain network (lowercased).
              additionalProperties: true
        destination:
          type: object
          description: Destination details (when applicable — e.g. for transfers, buy/sell, refunds).
          nullable: true
          properties:
            amount:
              type: integer
              description: Amount in minor units (cents).
            currency:
              type: string
              description: ISO 4217 currency code (lowercased).
            customer:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/CustomerId'
                  description: Destination customer (subject) unique ID.
            payment_method:
              type: object
              description: Payment method used on the destination leg.
              properties:
                id:
                  $ref: '#/components/schemas/PaymentMethodId'
                type:
                  type: string
                  description: Payment method type (lowercased).
                kind:
                  type: string
                  description: |
                    Payment method sub-type discriminator (lowercased). Canonical
                    alias of `type`; emitted alongside `type` with the same value.
                chain:
                  type: string
                  description: Blockchain network (lowercased).
              additionalProperties: true
        metadata:
          type: object
          nullable: true
          description: |
            Merchant-supplied arbitrary metadata, echoed back unchanged.
            Shape is defined by the merchant at request time.
          additionalProperties: true
        version:
          $ref: '#/components/schemas/ResourceVersion'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        settlement_date:
