    get:
      operationId: listDisputes
      summary: List disputes
      description: Retrieve a paginated list of disputes for the merchant.
      tags:
        - Disputes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/StartingAfterQuery'
        - $ref: '#/components/parameters/EndingBeforeQuery'
        - $ref: '#/components/parameters/CreatedAtGteQuery'
        - $ref: '#/components/parameters/CreatedAtLteQuery'
        - $ref: '#/components/parameters/UpdatedAtGteQuery'
        - $ref: '#/components/parameters/UpdatedAtLteQuery'
        - name: id
          in: query
          description: Comma-separated dispute ids to filter by
          schema:
            type: string
        - name: status
          in: query
          description: Comma-separated dispute statuses (case-insensitive)
          schema:
            type: string
        - name: date_from
          in: query
          description: Only disputes created on or after this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: Only disputes created on or before this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: evidence_due_from
          in: query
          description: Only disputes with evidence due on or after this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: evidence_due_to
          in: query
          description: Only disputes with evidence due on or before this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Dispute list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - has_more
                          - dispute_list
                        properties:
                          has_more:
                            type: boolean
                            description: |
                              True if more records exist beyond this page in the
                              requested direction.
                          count:
                            type: integer
                            description: |
                              Total records matching the active filters. Present
                              only when at least one non-time filter is supplied;
                              omitted on broad time-windowed scans.
                          dispute_list:
                            type: array
                            items:
                              $ref: '#/components/schemas/DisputeResponse'
