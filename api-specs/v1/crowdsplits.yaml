              properties:
                password:
                  type: string
                code:
                  type: string
                  description: TOTP code, required when 2FA is enabled
      responses:
        '200':
          description: Step-up granted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          stepUpToken:
                            type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/me/sessions:
    get:
      operationId: listSessions
      summary: List active sessions
      description: Return the user's active refresh-token sessions.
      tags:
        - Auth
      security:
        - accessTokenAuth: []
      responses:
        '200':
          description: Sessions retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            createdAt:
                              type: string
                              format: date-time
                            expiresAt:
                              type: string
                              format: date-time
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/auth/me/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Session ID to revoke
        schema:
          type: integer
    delete:
      operationId: revokeSession
      summary: Revoke a session
      description: Revoke a specific refresh-token session owned by the user.
      tags:
        - Auth
      security:
        - accessTokenAuth: []
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/auth/me/email/change/request:
    post:
      operationId: requestEmailChange
      summary: Request an email change
      description: |
        Request changing the account email. Sends a verification link to the new
        address. The token is returned in the response body only in DEV/TEST.
      tags:
        - Auth
      security:
        - accessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newEmail
                - password
              properties:
                newEmail:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Email-change requested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        properties:
                          token:
                            type: string
                            description: Confirmation token — only returned in DEV/TEST
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Email already registered to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/me/email/change/confirm:
    post:
      operationId: confirmEmailChange
      summary: Confirm an email change
      description: Public endpoint. Redeem the email-change token to update the address.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          email:
                            type: string
                            format: email
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Email already registered to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/auth/password/change:
    post:
      operationId: changePassword
      summary: Change password
      description: Change the account password after verifying the current password.
      tags:
        - Auth
