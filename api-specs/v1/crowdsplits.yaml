            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryPaymentRequest'
            example:
              provider: stripe
              source:
                payment_method:
                  type: card
                  id: de8gf5ee-3456-7890-1234-cdef12345678
      responses:
        '200':
          description: Payment retry initiated
