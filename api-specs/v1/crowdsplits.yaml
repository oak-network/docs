                password:
                  type: string
                  description: Password to set on the newly created account
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          email:
                            type: string
                            format: email
                          role:
                            type: string
