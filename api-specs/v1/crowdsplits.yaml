      responses:
        '200':
          description: Webhook acknowledged
  subscription.activated:
    post:
      summary: Subscription activated
      description: |
        Subscription activated. Emitted when a subscription transitions to the
        `active` state — either on initial activation after successful payment or
        when reactivating a previously canceled subscription. Payload is a
        `WebhookSubscriptionData` with the current subscription state.
      operationId: webhookSubscriptionActivated
      tags:
        - Webhook Events
      parameters:
        - $ref: '#/components/parameters/CrowdSplitSignatureHeader'
        - $ref: '#/components/parameters/CrowdSplitTimestampHeader'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event:
                      const: subscription.activated
                    category:
                      const: subscription_lifecycle
                    data:
                      $ref: '#/components/schemas/WebhookSubscriptionData'
      responses:
        '200':
          description: Webhook acknowledged
  subscription.canceled:
    post:
      summary: Subscription canceled
      description: |
        Subscription canceled. Emitted when a merchant or customer cancels an
        active subscription. The subscription remains accessible until its
        `end_time`; auto-renewal is disabled. Payload is a
        `WebhookSubscriptionData` with `status: canceled`.
      operationId: webhookSubscriptionCanceled
      tags:
        - Webhook Events
      parameters:
        - $ref: '#/components/parameters/CrowdSplitSignatureHeader'
        - $ref: '#/components/parameters/CrowdSplitTimestampHeader'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event:
                      const: subscription.canceled
                    category:
                      const: subscription_lifecycle
                    data:
                      $ref: '#/components/schemas/WebhookSubscriptionData'
      responses:
        '200':
          description: Webhook acknowledged
  subscription.created:
    post:
      summary: Subscription created
      description: |
        Subscription created. Emitted when a new subscription is created via the
        subscribe endpoint. The subscription may be in `pending_activation` or
        `queued` status depending on its start date. Payload is a
        `WebhookSubscriptionData` with the initial subscription state.
      operationId: webhookSubscriptionCreated
      tags:
        - Webhook Events
      parameters:
        - $ref: '#/components/parameters/CrowdSplitSignatureHeader'
        - $ref: '#/components/parameters/CrowdSplitTimestampHeader'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event:
                      const: subscription.created
                    category:
                      const: subscription_lifecycle
                    data:
                      $ref: '#/components/schemas/WebhookSubscriptionData'
      responses:
        '200':
          description: Webhook acknowledged
  subscription.expired:
    post:
      summary: Subscription expired
      description: |
        Subscription expired. Emitted when an active subscription reaches its
        `end_time` during auto-renewal processing and a new billing period begins.
        The old subscription transitions to `expired`; a new `subscription.renewed`
        event follows for the replacement subscription.
      operationId: webhookSubscriptionExpired
      tags:
        - Webhook Events
      parameters:
        - $ref: '#/components/parameters/CrowdSplitSignatureHeader'
        - $ref: '#/components/parameters/CrowdSplitTimestampHeader'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event:
                      const: subscription.expired
                    category:
                      const: subscription_lifecycle
                    data:
                      $ref: '#/components/schemas/WebhookSubscriptionData'
      responses:
        '200':
          description: Webhook acknowledged
  subscription.payment_failed:
    post:
      summary: Subscription payment failed
      description: |
        Subscription payment failed. Emitted when a payment attempt for a
        subscription fails. The subscription may still be retried up to the
        configured maximum attempts. If all retries are exhausted the subscription
        transitions to `failed` status.
      operationId: webhookSubscriptionPaymentFailed
      tags:
        - Webhook Events
      parameters:
        - $ref: '#/components/parameters/CrowdSplitSignatureHeader'
        - $ref: '#/components/parameters/CrowdSplitTimestampHeader'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event:
                      const: subscription.payment_failed
                    category:
                      const: subscription_lifecycle
                    data:
                      $ref: '#/components/schemas/WebhookSubscriptionData'
      responses:
        '200':
          description: Webhook acknowledged
  subscription.renewed:
    post:
      summary: Subscription renewed
      description: |
        Subscription renewed. Emitted when the auto-renewal cron creates a new
        subscription period for an expiring subscription. This event fires for the
        newly created subscription; the previous period receives a
        `subscription.expired` event. Payment for the new period is initiated
        immediately after renewal.
      operationId: webhookSubscriptionRenewed
      tags:
        - Webhook Events
      parameters:
        - $ref: '#/components/parameters/CrowdSplitSignatureHeader'
        - $ref: '#/components/parameters/CrowdSplitTimestampHeader'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event:
                      const: subscription.renewed
                    category:
                      const: subscription_lifecycle
                    data:
                      $ref: '#/components/schemas/WebhookSubscriptionData'
      responses:
        '200':
          description: Webhook acknowledged
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Merchant authentication token. Obtained via POST /api/v1/merchant/token/grant.
        Pass as: Authorization: Bearer <token>
    accessTokenAuth:
      type: apiKey
      in: header
      name: x-access-token
      description: |
        User JWT access token for user-level authentication.
        Used primarily for admin and internal operations.
    refAppKeyAuth:
      type: apiKey
      in: header
      name: Ref-App-Key
      description: |
        Subscription service authentication key.
        Used with Payment-Type: recurring_payment header for subscription payments.
  schemas:
    ApiResponse:
      type: object
      properties:
        msg:
          type: string
          description: Human-readable message describing the result
        data:
          description: Response payload (null on error)
        provider_message:
          type: string
          description: |
            Optional message forwarded from the underlying payment provider
            (Stripe, Bridge, …). Present when the operation surfaced a
            provider-side error or warning.
      required:
        - msg
        - data
    ErrorCode:
      type: string
      description: validation_error (400/413/422) · authentication_error (401) · authorization_error (403) · not_found (404) · conflict (409) · gone (410) · rate_limited (429) · internal_error (500) · provider_error (502) · provider_unavailable (503/504).
      enum:
        - validation_error
        - authentication_error
        - authorization_error
        - not_found
        - conflict
        - gone
        - rate_limited
        - internal_error
        - provider_error
        - provider_unavailable
    FailureReason:
      type: object
      properties:
        code:
          type: string
          description: Normalized, machine-stable reason identifier (small stable taxonomy, e.g. invalid_input, missing_required_information, card_declined).
        message:
          type: string
          nullable: true
          description: Human-readable, UI-safe description; null when none.
        fields:
          type: array
          items:
            type: string
          description: Affected normalized field names; [] when none apply.
        deadline:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339 hard-blocker deadline; null when none.
        provider_code:
          type: string
          nullable: true
          description: Raw provider code, verbatim, non-sensitive only (Stripe codes pass through; Bridge is always null).
        requires_manual_review:
          type: boolean
          description: True when the merchant cannot self-remediate (contact support instead of resubmitting).
        support_reference:
          type: string
          nullable: true
          description: Opaque support case ID when requires_manual_review is true; else null. Never parse or pattern-match.
      required:
        - code
        - message
        - fields
        - deadline
        - provider_code
        - requires_manual_review
        - support_reference
    ApiErrorResponse:
      type: object
      properties:
        msg:
          type: string
          description: Human-readable summary, safe for merchant logs (not for end-user display — use failure_reasons[].message instead).
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        failure_reasons:
          type: array
          description: Detailed structured reasons (§2.2 stable shape). Always present, possibly empty. Merchants must default-handle unknown codes.
          items:
            $ref: '#/components/schemas/FailureReason'
        data:
          description: Null for most errors. For error_code provider_error / provider_unavailable, may carry `provider_response` with a curated upstream snapshot.
          nullable: true
          type: object
          properties:
            provider_response:
              description: Raw provider-debug context (curated, non-sensitive).
        provider_message:
          type: string
          description: Legacy top-level mirror of provider detail kept for existing integrations (e.g. duplicate-payment-method detail). Additive; prefer failure_reasons.
      required:
        - msg
        - error_code
        - failure_reasons
        - data
    CustomerId:
      type: string
      description: |
        Customer identifier (`cus_` + UUID). Emitted prefixed (bare UUID
        possible while prefixed IDs roll out); both forms are accepted on
        input, and a prefix of a different resource type is rejected
        with 422.
      pattern: ^(cus_)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: cus_9c4f2a71-3e85-4b1a-9f27-6d5c8b3a2e10
    PaymentMethodId:
      type: string
      description: |
        Payment method identifier (`pm_` + UUID). Emitted prefixed (bare
        UUID possible while prefixed IDs roll out); both forms are accepted
        on input, and a prefix of a different resource type is rejected
        with 422.
      pattern: ^(pm_)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: pm_b2d84f6a-1c39-47e5-8a02-5e9d7c4b3f21
    CreatePaymentRequest:
      type: object
      description: |
        Payment creation request. The exact schema varies by provider and payment method type.
        Fields like provider, currency, and type are case-insensitive (uppercased internally).
      required:
        - provider
        - source
      properties:
        provider:
          type: string
          description: Payment provider
          enum:
            - stripe
        source:
          type: object
          required:
            - amount
            - currency
            - payment_method
          properties:
            amount:
              type: integer
              minimum: 1
              description: Amount in smallest currency unit (e.g. cents)
            currency:
              type: string
              description: ISO 4217 currency code
              enum:
                - usd
                - brl
                - cop
                - jpy
            customer:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/CustomerId'
                  description: CrowdSplit customer ID (`cus_<uuid>` or bare UUID — both accepted)
            payment_method:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum:
                    - card
                id:
                  $ref: '#/components/schemas/PaymentMethodId'
                  description: Saved payment method ID for card payments (`pm_<uuid>` or bare UUID — both accepted)
            capture_method:
              type: string
              enum:
                - automatic
                - manual
              description: Whether to capture immediately or manually later
            fraud_check:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                  description: Fraud check is currently not available. Must be set to false.
            installments:
              type: integer
              minimum: 0
              description: Number of installments (Stripe)
            float_rate:
              type: number
              description: Float rate for installment payments (Stripe)
        destination:
          type: object
          description: Destination details for cross-currency or split payments
          properties:
            amount:
              type: integer
              minimum: 1
            currency:
              type: string
            customer:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/CustomerId'
                  description: Destination customer ID (`cus_<uuid>` or bare UUID — both accepted)
        fee:
          type: object
          description: Fee configuration for destination flow
          properties:
            bearer:
              type: string
              enum:
                - platform
                - connected_account
              default: platform
        application_fee_amount:
          type: integer
          minimum: 1
          description: |
            Platform fee to collect from this charge, in the charge
            currency's minor units, the same convention as `source.amount`.
            Denominated in `source.currency` rather than the destination
            currency, and must not exceed `source.amount`.
            Requires `destination.customer.id`, since the fee is collected
            from the destination connected account. Supported on both
            `platform` and `destination` flows. Distinct from `fee.bearer`,
            which allocates the provider's processing fee.
        flow:
          type: string
          enum:
            - platform
            - destination
          default: platform
          description: Payment flow type (Stripe)
        allocations:
          type: array
          description: Fund allocation splits (for platform flow)
          items:
            type: object
            properties:
              type:
                type: string
                default: uncategorized
              receiver:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - platform
                      - connected_account
                  id:
                    type: string
                    format: uuid
              amount:
                type: integer
                minimum: 1
        confirm:
          type: boolean
          description: Whether to auto-confirm the payment
        metadata:
          type: object
          description: |
            Merchant-supplied arbitrary metadata, stored with the
            transaction and echoed back on the response and on any
            derived webhook deliveries. Shape is defined by the merchant.
          additionalProperties: true
    ResourceId:
      type: string
      description: |
        Resource identifier, emitted as `<prefix>_<uuid>` where the prefix
        encodes the resource type: payment `pay_`, refund `ref_`, transfer
        `tr_`, payout `po_`, buy `buy_`, sweep `swp_`, dispute `dis_`,
        customer `cus_`, payment method `pm_`, provider registration
        `preg_`, file `file_`.

        The prefix is presentation-layer only — the underlying identifier
        is the UUID, and while prefixed IDs roll out the bare UUID form may
        still appear on output. On input both the prefixed and bare forms
        are accepted; a prefix belonging to a different resource type is
        rejected with 422. Treat IDs as opaque strings.
      pattern: ^((pay|ref|tr|po|buy|swp|dis|cus|pm|preg|file)_)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: pay_a4c7e1f2-9b53-4d62-b0d4-3f8e2c5a1b9d
    PaymentId:
      type: string
      description: |
        Payment identifier (`pay_` + UUID). Emitted prefixed (bare UUID
        possible while prefixed IDs roll out); both forms are accepted on
        input, and a prefix of a different resource type is rejected
        with 422.
      pattern: ^(pay_)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: pay_a4c7e1f2-9b53-4d62-b0d4-3f8e2c5a1b9d
    RefundId:
      type: string
      description: |
        Refund identifier (`ref_` + UUID). Emitted prefixed (bare UUID
        possible while prefixed IDs roll out); both forms are accepted on
        input, and a prefix of a different resource type is rejected
        with 422.
      pattern: ^(ref_)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: ref_c81d4e2b-0f67-49a3-b5c2-7a1e9d3f5b60
    TransferId:
      type: string
      description: |
        Transfer identifier (`tr_` + UUID). Emitted prefixed (bare UUID
        possible while prefixed IDs roll out); both forms are accepted on
        input, and a prefix of a different resource type is rejected
        with 422.
      pattern: ^(tr_)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: tr_5a2c7e91-4b38-4f6d-a1e0-8c3b9d5f2a74
    PayoutId:
      type: string
      description: |
        Payout identifier. Payout list rows are transfer-typed
        transactions, so a payout ID usually carries the `tr_` prefix;
        `po_` appears on PAY_OUT-typed rows. Emitted prefixed (bare UUID
        possible while prefixed IDs roll out); both forms are accepted on
        input.
      pattern: ^((tr|po)_)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: po_d94b1f38-7c25-4a6e-9b02-3e5f8a1c7d96
    BuyId:
      type: string
      description: |
        Buy transaction identifier (`buy_` + UUID). Emitted prefixed (bare
        UUID possible while prefixed IDs roll out); both forms are accepted
        on input, and a prefix of a different resource type is rejected
        with 422.
      pattern: ^(buy_)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: buy_1f6e3a82-9d47-4c05-b8a1-2e7c5b9f4d13
    TransactionId:
      description: |
        Transaction identifier. Transactions are a family of resources, so
        the prefix follows the transaction's own type: payment `pay_`,
        refund `ref_`, transfer `tr_`, payout `po_`, buy `buy_`. Emitted
        prefixed (bare UUID possible while prefixed IDs roll out); both
        forms are accepted on input.
      example: pay_a4c7e1f2-9b53-4d62-b0d4-3f8e2c5a1b9d
      allOf:
        - $ref: '#/components/schemas/ResourceId'
        - anyOf:
            - $ref: '#/components/schemas/PaymentId'
            - $ref: '#/components/schemas/RefundId'
            - $ref: '#/components/schemas/TransferId'
            - $ref: '#/components/schemas/PayoutId'
            - $ref: '#/components/schemas/BuyId'
    ResourceVersion:
      type: integer
      minimum: 1
      description: 'Monotonically-increasing resource version (§2.6): 1 on creation, +1 on every state mutation that changes a wire-visible field. A given (id, version) pair always reflects the same resource state. Use it to order out-of-order webhook deliveries, ignore stale re-deliveries (version ≤ your cached value), and detect delivery gaps (backfill with a GET of the resource). A version bump without a corresponding webhook is possible (some wire-visible mutations don''t emit events) — treat a gap as "re-fetch", not "lost delivery".'
    DisputeId:
      type: string
      description: |
        Dispute identifier (`dis_` + UUID). Emitted prefixed (bare UUID
        possible while prefixed IDs roll out); both forms are accepted on
        input, and a prefix of a different resource type is rejected
        with 422.
      pattern: ^(dis_)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: dis_7f3a9c25-8b41-4e6d-b590-2c8f5a7d1e34
    PaymentResponse:
      type: object
      description: Payment transaction response object
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
          description: Transaction unique ID (`pay_` for payments, `ref_` for refunds)
        status:
          type: string
          description: Current transaction status (lowercased in response)
          enum:
            - initiated
            - awaiting_confirmation
            - processing
            - captured
            - succeeded
            - failed
            - canceled
        type:
          type: string
          description: Transaction type (lowercased in response)
          enum:
            - payment
            - refund
        provider:
          type: string
          description: Payment provider (lowercased in response)
        source:
          type: object
          description: Source details (amount + currency + customer + payment method).
          properties:
            amount:
              type: integer
              description: Amount in minor units (cents).
            currency:
              type: string
              description: ISO 4217 currency code (lowercased on the wire).
            payment_method:
              type: object
              description: Payment method used on the source leg. Extra keys vary by provider.
              properties:
                id:
                  $ref: '#/components/schemas/PaymentMethodId'
                  description: Payment method unique ID.
                type:
                  type: string
                  description: Payment method type (lowercased — card, pix, bank, …).
                kind:
                  type: string
                  description: |
                    Payment method sub-type discriminator (lowercased). Canonical
                    alias of `type`; emitted alongside `type` with the same value.
                chain:
                  type: string
                  description: Blockchain network when the method is on-chain (lowercased).
              additionalProperties: true
            customer:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/CustomerId'
                  description: Customer (subject) unique ID.
        fee:
          type: object
          description: |
            Fee configuration, echoed back unchanged from the request body.
            Present only when the merchant supplied one.
          properties:
            bearer:
              type: string
              description: Who bears the provider's processing fee (lowercased).
          additionalProperties: true
        application_fee_amount:
          type: integer
          description: |
            Platform fee taken from the charge, in the charge currency's
            minor units. Echoed back from the request body; present only
            when the merchant supplied one.
        version:
          $ref: '#/components/schemas/ResourceVersion'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        settlement_date:
          type:
            - string
            - 'null'
          format: date-time
        metadata:
          type: object
          nullable: true
          description: |
            Merchant-supplied arbitrary metadata, echoed back unchanged on
            the response and on any derived webhook deliveries. Shape is
            defined by the merchant at request time.
          additionalProperties: true
        refund_ids:
          type: array
          description: |
            Refund back-links for this payment. Always present on payment
            responses (empty when none). Absent for non-payment types.
          items:
            $ref: '#/components/schemas/RefundId'
        dispute_ids:
          type: array
          description: |
            Dispute back-links for this payment. Always present on payment
            responses (empty when none). Absent for non-payment types.
          items:
            $ref: '#/components/schemas/DisputeId'
    MerchantResponse:
      type: object
      description: |
        Merchant record returned by the dashboard merchant endpoints
        (POST /merchant, GET /merchant, GET /merchant/:id, PATCH /merchant/:id).
      properties:
        id:
          type: string
          format: uuid
          description: |
            Public, client-facing merchant identifier (the merchant uid).
            The internal numeric primary key is never exposed on the wire.
        legalName:
          type: string
        address:
          type: string
        website:
          type: string
        taxNumber:
          type: string
        appId:
          type: string
          description: Generated application ID
        activationStatus:
          type: string
          description: |
            Activation/KYB lifecycle and the single source of truth for live
            access. "Can process live" == activationStatus === 'approved'.
          enum:
            - not_submitted
            - submitted
            - in_review
            - approved
            - changes_requested
            - rejected
            - suspended
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - legalName
        - address
        - website
        - taxNumber
        - appId
        - activationStatus
        - createdAt
    CreateMerchantRequest:
      type: object
      required:
        - legal_name
        - address
        - website
        - tax_number
      properties:
        legal_name:
          type: string
          description: Legal business name
        address:
          type: string
          description: Business address
        website:
          type: string
          description: Official website URL
        tax_number:
          type: string
          description: Tax identification number
    GrantTokenRequest:
