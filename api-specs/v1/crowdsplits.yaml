        access provider-specific status codes on failure.
      operationId: webhookSellFailed
      tags:
        - Webhook Events
      parameters:
        - $ref: '#/components/parameters/CrowdSplitSignatureHeader'
        - $ref: '#/components/parameters/CrowdSplitTimestampHeader'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event:
                      const: sell.failed
                    category:
                      const: sell_lifecycle
                    data:
                      $ref: '#/components/schemas/WebhookTransactionData'
      responses:
        '200':
          description: Webhook acknowledged
  sell.succeeded:
    post:
      summary: Sell succeeded
      description: |
        Sell succeeded. Emitted during a sell (stablecoin → fiat) flow. Payload is a
        `WebhookTransactionData` with `type: sell`. Use `data.provider_response` to
        access provider-specific status codes on failure.
      operationId: webhookSellSucceeded
      tags:
        - Webhook Events
      parameters:
        - $ref: '#/components/parameters/CrowdSplitSignatureHeader'
        - $ref: '#/components/parameters/CrowdSplitTimestampHeader'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event:
                      const: sell.succeeded
                    category:
                      const: sell_lifecycle
                    data:
                      $ref: '#/components/schemas/WebhookTransactionData'
      responses:
        '200':
          description: Webhook acknowledged
  external.deposit.awaiting_confirmation:
    post:
      summary: External deposit awaiting confirmation
      description: |
        External deposit awaiting confirmation. Emitted during the external-deposit
        lifecycle (funds arriving from outside CrowdSplit, e.g., a bank wire or
        on-chain transfer to a virtual account). Payload is a
        `WebhookTransactionData` with `type: external_deposit`; reconcile against
        bank or on-chain records.
      operationId: webhookExternalDepositAwaitingConfirmation
      tags:
        - Webhook Events
      parameters:
