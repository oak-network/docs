          description: Record last-update timestamp
    RetryPaymentRequest:
      type: object
      required:
        - provider
        - source
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 50
          description: Payment provider (e.g. stripe)
        source:
          type: object
          required:
            - payment_method
          properties:
            payment_method:
              type: object
              required:
                - type
                - id
              properties:
                type:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: Payment method type (e.g. card)
                id:
                  $ref: '#/components/schemas/PaymentMethodId'
                  description: Payment method ID to use for the retry (`pm_<uuid>` or bare UUID — both accepted)
    ProviderProxyResponse:
      type: object
      properties:
        msg:
          type: string
          description: Human-readable message describing the result.
        data:
          type: object
          properties:
            provider_status:
              type: integer
              description: Upstream provider HTTP status. 200 (or other 2xx) on success; a 4xx when the provider semantically rejected the request. SDK callers must branch on this before treating HTTP 200 as success.
            provider_response:
              description: Raw upstream provider response body, passed through verbatim (Bridge payloads have `developer_reason` fields stripped). Any JSON value — usually an object, but a provider or intermediary gateway may answer (notably on 4xx/5xx) with a string (plain-text or HTML error page), an array, or an empty body (`null`). Shape varies by provider and endpoint — consult the provider's own API docs and always branch on `provider_status` first.
          required:
            - provider_status
            - provider_response
      required:
        - msg
        - data
    MaintenanceResponse:
      type: object
      properties:
        id:
          type: string
          example: abc123xyz
        name:
          type: string
          example: Scheduled DB migration
        scheduledFor:
          type: string
          format: date-time
          example: '2026-07-20T02:00:00Z'
        scheduledUntil:
          type: string
          format: date-time
          example: '2026-07-20T03:00:00Z'
    CountryResponse:
      type: object
      description: |
        A country known to CrowdSplit, with a flag indicating whether KYC is
        currently supported (Stripe Connect card-payments capability + Bridge
        allowed). Source list: RCS-453.
      required:
        - iso_alpha_2
        - name
        - kyc_supported
      properties:
        iso_alpha_2:
          type: string
          description: ISO 3166-1 alpha-2 country code (two uppercase letters).
          example: US
        name:
          type: string
          description: Country display name.
          example: United States
        kyc_supported:
          type: boolean
          description: |
            True when CrowdSplit currently accepts this country for KYC
            (mutual Stripe ∩ Bridge support).
    ProviderSnapshotData:
      type: object
      required:
        - provider_response
        - version
        - retrieved_at
      properties:
        provider_response:
          type: object
          additionalProperties: true
          description: The full untruncated provider snapshot for this (resource, id, version), curated to the resource's §2.4 allowlist with the same redaction policy as webhook payloads.
        version:
          $ref: '#/components/schemas/ResourceVersion'
          description: Echoes the `version` path parameter.
        retrieved_at:
          type: string
          format: date-time
          description: Server-side time the snapshot was fetched.
    WebhookEnvelope:
      type: object
      description: |
        Base envelope delivered to merchant webhook endpoints. Every webhook
        request body has the shape `{ id, api_version, event, category, data }`;
        concrete event schemas compose this base via `allOf` and refine `event` /
        `category` to their `const` values and `data` to a specific schema.

        Each delivery carries two headers:
          CrowdSplit-Signature        `t={unix-ts},v1={hex-hmac-sha256}`
          CrowdSplit-Timestamp        seconds since epoch

        There is no notification-ID header — the notification ID is the
        envelope's top-level `id` field, stable across retries of the same
        logical event. Merchants MUST verify the HMAC of the raw body using
        the webhook secret returned at registration, and SHOULD reject the
        delivery if `CrowdSplit-Timestamp` differs from the current time by
        more than 5 minutes. Duplicate envelope `id` values indicate a retry
        of a previously dispatched delivery and should be deduplicated.
      required:
        - id
        - api_version
        - event
        - category
        - data
      properties:
        id:
          type: string
          pattern: ^(evt_)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: |
            Notification ID per §1.4 — `evt_` prefix + UUID v4, stable across
            retry attempts; the merchant dedup key. Transition: events emitted
            before the prefix cutover carry the bare UUID form; both forms are
            accepted wherever an id is supplied back.
        api_version:
          type: string
          pattern: ^v[0-9]+$
          description: |
            API version of the payload builder that produced this event
            (currently always `v1`). Reports the version of the code that built
            `data` — not a globally-bumped number — so when one event type later
            moves to v2, only that event reports `v2`. Branch on this field if
            you need to handle multiple payload shapes for the same event.
          example: v1
        event:
          type: string
          description: Event name; specialized via `allOf` per operation (e.g. `payment.succeeded`).
        category:
          type: string
          description: Event category; specialized via `allOf` per operation (e.g. `payment_lifecycle`).
        data:
          type: object
          description: Event-specific payload; each operation refines this via `allOf` to a concrete schema.
    ProviderName:
      type: string
      description: |
        CrowdSplit-managed upstream provider identifier. Lowercased in every
        merchant-facing payload.

        Note: merchant-facing `*.provider` fields emit `avenia` in place
        of `brla` in the lowercased form; consumers should treat the two
        as equivalent for now.
      enum:
        - stripe
        - bridge
        - wallet_service
        - crowd_split
    TransactionStatus:
      type: string
      description: |
        Transaction lifecycle status (lowercased on the wire).
      enum:
        - created
        - awaiting_confirmation
        - processing
        - captured
        - succeeded
        - failed
        - canceled_after_completion
        - canceled
    TruncatedProviderResponse:
      type: object
      required:
        - truncated
        - version
        - size_bytes
        - full_resource_url
      properties:
        truncated:
          type: boolean
          enum:
            - true
          description: Discriminator — present (and true) only on the summary form.
        version:
          $ref: '#/components/schemas/ResourceVersion'
          description: The resource version whose snapshot the URL serves — the version at which provider_response last changed. May be LOWER than the payload's own `version` (only other fields changed since); never higher.
        size_bytes:
          type: integer
          minimum: 0
          description: Serialized size of the removed provider_response value.
        full_resource_url:
          type: string
          format: uri
          description: '`GET /api/v1/<resource>/{id}/provider-snapshot/{version}` (§10h) — bearer-authenticated with your normal API token (not a presigned URL), multi-use within audit retention, 410 Gone after purge.'
    WebhookTransactionData:
      type: object
      description: Data payload for payment, refund, transfer, buy, sell, payout, and external events
      required:
        - id
        - provider
        - status
        - source
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
          description: Transaction unique ID (prefixed by transaction type — `pay_`/`ref_`/`tr_`/`po_`/`buy_`).
        provider:
          $ref: '#/components/schemas/ProviderName'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        version:
          $ref: '#/components/schemas/ResourceVersion'
        changes:
          type: array
          description: |
            Top-level fields whose value changed in the resource's most recent
            state transition, computed server-side in the database and persisted
            with the resource. Empty on the resource's first event; an
            immaterial re-save or redelivery carries the prior diff forward
            rather than resetting it. Absent when the server could not compute
            the diff — treat an absent value as "anything may have changed",
            never as "nothing changed". Use it to route handling (e.g. react
            only to `status` transitions) without diffing full payloads.
          items:
            type: string
        source:
          type: object
          description: Source details (amount, currency, customer, payment_method).
          properties:
            amount:
              type: integer
              description: Amount in minor units (cents).
            currency:
              type: string
              description: ISO 4217 currency code (lowercased on the wire).
            customer:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/CustomerId'
                  description: Customer (subject) unique ID.
            payment_method:
              type: object
              description: Payment method used on the source leg. Extra keys vary by provider.
              properties:
                id:
                  $ref: '#/components/schemas/PaymentMethodId'
                  description: Payment method unique ID.
                type:
                  type: string
                  description: Payment method type (lowercased — card, pix, bank, …).
                kind:
                  type: string
                  description: |
                    Payment method sub-type discriminator (lowercased). Canonical
                    alias of `type`; emitted alongside `type` with the same value.
                chain:
                  type: string
                  description: Blockchain network when the method is on-chain (lowercased).
              additionalProperties: true
            capture_method:
              type: string
              description: Capture strategy (lowercased — e.g. automatic, manual).
            fraud_check:
              type: object
              description: |
                Fraud-check configuration and result (when applicable). Present
                only on transaction types that route through fraud screening.
              properties:
                provider:
                  type: string
                  description: Fraud-check provider identifier (lowercased).
                config:
                  type: object
                  properties:
                    threshold:
                      type: string
                      description: Fraud score threshold applied (lowercased identifier).
                    sequence:
                      type: string
                      description: Sequence strategy identifier (lowercased).
              additionalProperties: true
          additionalProperties: true
        destination:
          type: object
          description: |
            Destination details (if applicable). Shares the same shape as
            `source` because the wire serialization reuses one TS type
            (`WebhookTransactionLeg`) for both legs — `capture_method` /
            `fraud_check` are uncommon on a destination but can appear when
            the merchant supplies them in the request body.
          nullable: true
          properties:
            amount:
              type: integer
              description: Amount in minor units (cents).
            currency:
              type: string
              description: ISO 4217 currency code (lowercased).
            customer:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/CustomerId'
                  description: Destination customer (subject) unique ID.
            payment_method:
              type: object
              description: Payment method used on the destination leg.
              properties:
                id:
                  $ref: '#/components/schemas/PaymentMethodId'
                type:
                  type: string
                  description: Payment method type (lowercased).
                kind:
                  type: string
                  description: |
                    Payment method sub-type discriminator (lowercased). Canonical
                    alias of `type`; emitted alongside `type` with the same value.
                chain:
                  type: string
                  description: Blockchain network (lowercased).
              additionalProperties: true
            capture_method:
              type: string
              description: Capture strategy (lowercased). Rarely set on destination.
            fraud_check:
              type: object
              description: Fraud-check details. Rarely set on destination.
              additionalProperties: true
          additionalProperties: true
        fee:
          type: object
          nullable: true
          description: |
            Platform / provider fee charged on this transaction, when present.
            Shape originates from the merchant's request body.
          properties:
            bearer:
              type: string
              description: |
                Who bears the fee. Stripe connected-account flows require
                `connected_account`; may be absent for other providers or
                flow types.
            amount:
              type: integer
              description: Fee amount in minor units (cents).
            currency:
              type: string
              description: Fee currency (lowercased).
          additionalProperties: true
        application_fee_amount:
          type: integer
          description: |
            Platform fee taken from the charge, in the charge currency's
            minor units. Echoed back from the request body; present only
            when the merchant supplied one.
        reference_transaction_id:
          type:
            - string
            - 'null'
          pattern: ^(pay_)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: |
            Parent payment ID (for refunds). Emitted as `pay_<uuid>` (bare
            UUID possible while prefixed IDs roll out); both forms are
            accepted wherever this value is sent back as input.
          example: pay_a4c7e1f2-9b53-4d62-b0d4-3f8e2c5a1b9d
        total_installments:
          type:
            - integer
            - 'null'
        installments:
          type:
            - array
            - 'null'
          items:
            type: object
            properties:
              number:
                type: integer
              amount:
                type: integer
              status:
                type: string
              settlement_date:
                type: string
                format: date-time
        settlement_date:
          type:
            - string
            - 'null'
          format: date-time
        metadata:
          type: object
          nullable: true
          description: |
            Merchant-supplied arbitrary metadata, echoed back unchanged.
            Shape is defined by the merchant at request time.
          additionalProperties: true
        provider_response:
          description: |
            Raw excerpt of the upstream provider's response. Key set varies
            by provider and by call — do not rely on specific keys. Useful
            for debugging and for forwarding provider-specific error codes.

            When the serialized payload would exceed the §2.9.3 256KB cap,
            this field alone is replaced by the truncated summary form
            (`truncated: true`) — follow its `full_resource_url` to retrieve
            the full snapshot. Documented top-level fields are never affected.
          oneOf:
            - type: object
              nullable: true
              additionalProperties: true
              description: Full provider excerpt (normal case).
            - $ref: '#/components/schemas/TruncatedProviderResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookDisputeData:
      type: object
      description: Data payload for dispute events
      required:
        - id
        - status
      properties:
        id:
          $ref: '#/components/schemas/DisputeId'
          description: Dispute unique ID
        status:
          type: string
        version:
          $ref: '#/components/schemas/ResourceVersion'
        changes:
          type: array
          description: |
            Top-level fields whose value changed in the resource's most recent
            state transition, computed server-side in the database and persisted
            with the resource. Empty on the resource's first event; an
            immaterial re-save or redelivery carries the prior diff forward
            rather than resetting it. Absent when the server could not compute
            the diff — treat an absent value as "anything may have changed",
            never as "nothing changed". Use it to route handling (e.g. react
            only to `status` transitions) without diffing full payloads.
          items:
            type: string
        evidence_due_by:
          type:
            - string
            - 'null'
          format: date-time
        evidences:
          type: array
          description: |
            Attached dispute evidence records. Shape follows the merchant's
            submission via `POST /api/v1/disputes/{dispute_id}/evidence`;
            keys match those accepted by that endpoint.
          items:
            type: object
            additionalProperties: true
        payment:
          type: object
          description: Associated payment transaction (summary fields only).
          required:
            - id
            - type
            - status
          properties:
            id:
              $ref: '#/components/schemas/PaymentId'
              description: Payment transaction UID.
            type:
              type: string
              description: Transaction type (lowercased — e.g. `payment`).
            status:
              type: string
              description: Payment's current status (lowercased).
        reference_transaction:
          type: object
          description: |
            Point-in-time snapshot of the disputed payment (id, status, source,
            destination, …). Canonical nested reference; emitted alongside
            `payment` with the same value. For live state call `GET /payments/{id}`.

            The nested `provider_response` is subject to §2.9.3 truncation like
            any other: on oversized dispute payloads both nested snapshots carry
            the truncated summary (`truncated: true`) pointing at the payment's
            own provider snapshot.
          additionalProperties: true
          properties:
            id:
              $ref: '#/components/schemas/PaymentId'
            status:
              type: string
            type:
              type: string
            provider_response:
              oneOf:
                - type: object
                  nullable: true
                  additionalProperties: true
                - $ref: '#/components/schemas/TruncatedProviderResponse'
    NormalizedFailureReason:
      type: object
      description: |
        A single normalized rejection reason in a `failure_reasons` array.
        Codes are stable across providers; new codes may be added as more
        provider rejection types are mapped — treat unrecognised codes as
        `unknown`.
      required:
        - code
      properties:
        code:
          type: string
          description: |
            Stable normalized failure code. Current values:
            `verification_failed`, `expired_document`, `duplicate_data`,
            `invalid_input`, `compliance_review`, `provider_rejected`,
            `requirements_incomplete`, `missing_required_information`,
            `unknown`.
        message:
          type: string
          description: Human-readable explanation from the provider.
        fields:
          type: array
          items:
            type: string
          description: |
            Affected field names (e.g. `identity_document`, `address`).
            Only present when the code identifies specific fields.
        endorsement:
          type: string
          description: |
            Endorsement name (e.g. `base`, `sepa`). Only present when
            `code` is `requirements_incomplete` and the failure relates
            to an endorsement requirement.
    WebhookProviderRegistrationData:
      type: object
      description: Data payload for customer, KYC, and provider registration events
      required:
        - id
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/CustomerId'
          description: Customer unique ID (carries the customer `cus_` prefix)
        status:
          type: string
          description: Registration status (lowercased)
        provider:
          $ref: '#/components/schemas/ProviderName'
        target_role:
          type: string
          description: Target role (lowercased)
        provider_response:
          description: |
            Raw excerpt of the provider's registration response. Shape
            varies by provider — do not rely on specific keys.

            When the serialized payload would exceed the §2.9.3 256KB cap,
            this field alone is replaced by the truncated summary form
            (`truncated: true`) — follow its `full_resource_url` to retrieve
            the full snapshot.
          oneOf:
            - type: object
              nullable: true
              additionalProperties: true
              description: Full provider excerpt (normal case).
            - $ref: '#/components/schemas/TruncatedProviderResponse'
        failure_reasons:
          type:
            - array
            - 'null'
          description: |
            Structured rejection reasons. Present when the provider rejects
            a customer or KYC step, or when endorsement requirements are
            incomplete. Null when no failures are recorded.
          items:
            $ref: '#/components/schemas/NormalizedFailureReason'
        readiness:
          type:
            - string
            - 'null'
          description: Provider readiness status
        version:
          $ref: '#/components/schemas/ResourceVersion'
        changes:
          type:
            - array
            - 'null'
          description: |
            Field names whose values changed in this event, relative to the
            previous emitted state. Useful for merchants that want to
            react only to specific field transitions.
          items:
            type: string
        action_required:
          type:
            - boolean
            - 'null'
          description: |
            Whether merchant or customer action is required. True for
            recoverable rejections and approvals with pending future
            requirements; false for terminal rejections (e.g. offboarded,
            sanctions-blocked).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true
    WebhookCustomerSyncData:
      type: object
      description: Data payload for customer sync events
      required:
        - id
        - provider
        - fields
        - attempt_id
      properties:
        id:
          $ref: '#/components/schemas/CustomerId'
          description: Customer unique ID
        provider:
          $ref: '#/components/schemas/ProviderName'
        fields:
          type: array
          items:
            type: string
          description: Fields being synced
        attempt_id:
          type: string
          description: Sync attempt identifier
        version:
          $ref: '#/components/schemas/ResourceVersion'
        changes:
          type: array
          description: |
            Top-level fields whose value changed in the resource's most recent
            state transition, computed server-side in the database and persisted
            with the resource. Empty on the resource's first event; an
            immaterial re-save or redelivery carries the prior diff forward
            rather than resetting it. Absent when the server could not compute
            the diff — treat an absent value as "anything may have changed",
            never as "nothing changed". Use it to route handling (e.g. react
            only to `status` transitions) without diffing full payloads.
          items:
            type: string
        synced_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp of successful sync (only on success)
        provider_data:
          type: object
          nullable: true
          description: |
            Data returned from the provider (only on success). Shape varies
            by provider — do not rely on specific keys.
          additionalProperties: true
        error:
          type:
            - string
            - 'null'
          description: Error message (only on failure)
    PaymentMethodType:
      type: string
      description: |
        Payment-method type identifier (lowercased).
      enum:
        - bank
        - card
        - plaid
        - virtual_account
        - liquidation_address
        - trading_wallet
        - customer_wallet
        - pix
        - evm_address
    WebhookPaymentMethodData:
      type: object
      description: Data payload for payment method events
      required:
        - id
        - customer_id
        - provider
        - status
        - type
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/PaymentMethodId'
          description: Payment method unique ID
        customer_id:
          $ref: '#/components/schemas/CustomerId'
        provider:
          $ref: '#/components/schemas/ProviderName'
        status:
          type: string
          description: Payment method status (lowercased)
        version:
          $ref: '#/components/schemas/ResourceVersion'
        changes:
          type: array
          description: |
            Top-level fields whose value changed in the resource's most recent
            state transition, computed server-side in the database and persisted
            with the resource. Empty on the resource's first event; an
            immaterial re-save or redelivery carries the prior diff forward
            rather than resetting it. Absent when the server could not compute
            the diff — treat an absent value as "anything may have changed",
            never as "nothing changed". Use it to route handling (e.g. react
            only to `status` transitions) without diffing full payloads.
          items:
            type: string
        type:
          $ref: '#/components/schemas/PaymentMethodType'
        country:
          type:
            - string
            - 'null'
        chain:
          type:
            - string
            - 'null'
        currency:
          type:
            - string
            - 'null'
        bank_account_type:
          type:
            - string
            - 'null'
        source_currency:
          type:
            - string
            - 'null'
          description: |
            Source-leg currency on payment methods that mediate a currency
            conversion (lowercased). Present only for cross-currency methods.
        destination_currency:
          type:
            - string
            - 'null'
          description: |
            Destination-leg currency on payment methods that mediate a
            currency conversion (lowercased).
        metadata:
          type: object
          nullable: true
          description: |
            Merchant-supplied arbitrary metadata for the payment method.
            Shape is defined by the merchant at registration.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true
    WebhookSubscriptionData:
      type: object
      description: Data payload for subscription lifecycle events
      required:
        - id
        - plan_id
        - status
        - source_customer_id
      properties:
        id:
          type: string
          format: uuid
          description: Subscription unique ID
        plan_id:
          type: string
          format: uuid
          description: Associated plan ID
        status:
          type: string
          enum:
            - queued
            - pending_activation
            - active
            - canceled
            - expired
            - failed
          description: Current subscription status
        start_time:
          type:
            - string
            - 'null'
          format: date-time
          description: Subscription start time
        end_time:
          type:
            - string
            - 'null'
          format: date-time
          description: Subscription end time
        auto_renew:
          type: boolean
          description: Whether the subscription auto-renews
        source_customer_id:
          type: string
          description: Customer being charged
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: Required
            error_code: validation_error
            failure_reasons:
              - code: missing_required_information
                message: Required
                fields:
                  - source.amount
                deadline: null
                provider_code: null
                requires_manual_review: false
                support_reference: null
            data: null
    UnauthorizedError:
      description: Authentication credentials are missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: Token is Missing!
            error_code: authentication_error
            failure_reasons:
              - code: missing_token
                message: null
                fields: []
                deadline: null
                provider_code: null
                requires_manual_review: false
                support_reference: null
            data: null
    ForbiddenError:
      description: Authenticated but not authorized for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: You don't have access
            error_code: authorization_error
            failure_reasons:
              - code: insufficient_permissions
                message: Insufficient permissions
                fields: []
                deadline: null
                provider_code: null
                requires_manual_review: false
                support_reference: null
            data: null
    NotFoundError:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: Resource not found
            error_code: not_found
            failure_reasons: []
            data: null
    ConflictError:
      description: State conflict (e.g. Idempotency-Key reuse with a different body)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: This Idempotency-Key was already used with a different request body.
            error_code: conflict
            failure_reasons:
              - code: idempotency_mismatch
                message: This Idempotency-Key was already used with a different request body.
                fields: []
                deadline: null
                provider_code: null
                requires_manual_review: false
                support_reference: null
            data: null
    PayloadTooLargeError:
      description: Body-size violation (file upload >10 MB, proxy body >256 KB)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: File too large
            error_code: validation_error
            failure_reasons:
              - code: payload_too_large
                message: null
                fields:
                  - file
                deadline: null
                provider_code: null
                requires_manual_review: false
                support_reference: null
            data: null
    RateLimitedError:
      description: Per-merchant rate limit exceeded. Carries Retry-After and X-RateLimit-* headers (§1.10).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: Rate limit exceeded. Retry after the interval indicated by the Retry-After header.
            error_code: rate_limited
            failure_reasons:
              - code: rate_limit_exceeded
                message: null
                fields: []
                deadline: null
                provider_code: null
                requires_manual_review: false
                support_reference: null
            data: null
    InternalServerError:
      description: Platform-side error. Retryable with the same Idempotency-Key (§1.9); support_reference correlates with server logs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: Internal server error.
            error_code: internal_error
            failure_reasons:
              - code: internal_error
                message: null
                fields: []
                deadline: null
                provider_code: null
                requires_manual_review: true
                support_reference: <support-reference>
            data: null
    ProviderError:
      description: Upstream provider returned an error (§1.8). data.provider_response carries a curated upstream snapshot.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: Stripe rejected the payment intent
            error_code: provider_error
            failure_reasons:
              - code: card_declined
                message: Your card was declined.
                fields:
                  - source.payment_method
                deadline: null
                provider_code: card_declined
                requires_manual_review: false
                support_reference: null
            data:
              provider_response:
                decline_code: generic_decline
    ProviderUnavailableError:
      description: Upstream provider unreachable (503) or timed out (504). Transport failure — retry with the same Idempotency-Key (§1.9).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: Bridge did not respond within the configured timeout.
            error_code: provider_unavailable
            failure_reasons:
              - code: provider_unavailable
                message: null
                fields: []
                deadline: null
                provider_code: null
                requires_manual_review: false
                support_reference: null
            data: null
    GoneError:
      description: 'Resource existed but has been purged — §10h provider snapshots outside the §1.12 audit-retention window (non-financial: 1 year). The resource itself may still exist via its per-resource GET; only the snapshot at that specific version is gone.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            msg: Provider snapshot purged.
            error_code: gone
            failure_reasons:
              - code: snapshot_purged
                message: Snapshot for this version has been purged per audit retention policy
                fields: []
                deadline: null
                provider_code: null
                requires_manual_review: false
                support_reference: null
            data: null
  parameters:
    RefAppKeyHeader:
      name: Ref-App-Key
      in: header
      required: false
      description: App key for subscription service authentication
      schema:
        type: string
    PaymentTypeHeader:
      name: Payment-Type
      in: header
      required: false
      description: Set to 'recurring_payment' for subscription payment flows
      schema:
        type: string
        enum:
          - recurring_payment
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Page size. Default 10, maximum 100 (larger values are clamped).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    StartingAfterQuery:
      name: starting_after
      in: query
      required: false
      description: |
        Cursor — the `id` of a record from a previous page (typically the last
        item's id). Returns records after it in the list order
        (`created_at DESC, id DESC`; `updated_at DESC, id DESC` when an
        `updated_at[*]` filter is present). The cursor record itself is excluded.
        Mutually exclusive with `ending_before`. Treated as an opaque token —
        an id that doesn't resolve to a record fails with `invalid_cursor`.
      schema:
        type: string
    EndingBeforeQuery:
      name: ending_before
      in: query
      required: false
      description: |
        Cursor — the `id` of a record from a previous page (typically the first
        item's id). Returns the records immediately preceding it in the list
        order. The cursor record itself is excluded. Mutually exclusive with
        `starting_after`. Treated as an opaque token — an id that doesn't
        resolve to a record fails with `invalid_cursor`.
      schema:
        type: string
    CreatedAtGteQuery:
      name: created_at[gte]
      in: query
      required: false
      description: Only records created at or after this RFC 3339 timestamp.
      schema:
        type: string
        format: date-time
    CreatedAtLteQuery:
      name: created_at[lte]
      in: query
      required: false
      description: Only records created at or before this RFC 3339 timestamp.
      schema:
        type: string
        format: date-time
    UpdatedAtGteQuery:
      name: updated_at[gte]
      in: query
      required: false
      description: |
        Only records updated at or after this RFC 3339 timestamp. Any
        `updated_at[*]` filter switches the list to reconciliation mode —
        ordering and cursors anchor on `updated_at` instead of `created_at`.
        Use for post-outage "everything changed since" walks.
      schema:
        type: string
        format: date-time
    UpdatedAtLteQuery:
      name: updated_at[lte]
      in: query
      required: false
      description: |
        Only records updated at or before this RFC 3339 timestamp. Triggers
        reconciliation mode like `updated_at[gte]`.
      schema:
        type: string
        format: date-time
    OffsetQuery:
      name: offset
      in: query
      required: false
      description: Number of records to skip
      schema:
        type: integer
        minimum: 0
        default: 0
    CrowdSplitSignatureHeader:
      name: CrowdSplit-Signature
      in: header
      required: true
      description: |
        HMAC-SHA256 signature over the raw request body, signed with the
        merchant's webhook secret. Format: `t={unix-ts},v1={hex-hmac}`.
      schema:
        type: string
        example: t=1713456789,v1=a1b2c3d4e5f6abcdef1234567890abcdef1234567890abcdef1234567890abcd
    CrowdSplitTimestampHeader:
      name: CrowdSplit-Timestamp
      in: header
      required: true
      description: |
        Unix timestamp (seconds since epoch) at dispatch. Merchants should
        reject the delivery if the skew against their own clock exceeds
        5 minutes, to limit replay windows.
      schema:
        type: integer
        example: 1713456789
  headers: {}
x-tagGroups:
  - name: Authentication
    tags:
      - Auth
  - name: Merchant Account
    tags:
      - Merchants
      - Subscriptions
      - Webhooks
  - name: Customers & KYC
    tags:
      - Customers
      - Payment Methods
      - Provider Registration
  - name: Payment Flows
    tags:
      - Payments
      - Payouts
      - Transfers
      - Buy / Sell
      - Wallets
  - name: Operations
    tags:
      - Transactions
      - Disputes
      - Provider Snapshots
      - Tax
      - Files
      - Generic
      - System
  - name: Webhook Catalog
    tags:
      - Webhook Events
