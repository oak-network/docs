openapi: 3.1.0
info:
  title: CrowdSplit API
  version: 1.0.0
  description: |
    CrowdSplit is a payment-orchestration API that routes payment,
    payout, transfer, buy/sell, KYC, and wallet operations across
    multiple upstream providers (Stripe, Bridge, and others) behind a
    single merchant-facing contract.

    ## Authentication

    Three auth schemes are in use:

    - **`bearerAuth`** — a JWT issued via `POST /api/v1/merchant/token/grant`
      using your `client_id` + `client_secret`. Pass as
      `Authorization: Bearer <token>`. This is the default for every
      merchant-facing operation unless an operation documents otherwise.
    - **`accessTokenAuth`** — user-scoped JWT (obtained via
      `POST /api/auth/signin`) passed in the `x-access-token` header.
      Used for admin/internal operations.
    - **`refAppKeyAuth`** — subscription-service shared key passed in
      the `Ref-App-Key` header, combined with `Payment-Type: recurring_payment`.
      Used only for recurring-payment flows.

    ## Webhooks

    CrowdSplit delivers webhooks as `POST` requests to merchant-registered
    URLs. Every delivery carries the envelope
    `{ id, event, category, data }` and two HTTP headers:

    - `CrowdSplit-Signature` — HMAC-SHA256 over the raw body, formatted
      as `t={unix-ts},v1={hex-hmac}`. Verify with the secret returned at
      webhook registration.
    - `CrowdSplit-Timestamp` — seconds since epoch at dispatch. Reject
      if the skew exceeds 5 minutes.

    Use the envelope's `id` for idempotency — the same `id` is used for
    all retry attempts of a given notification.

    Failed deliveries are retried on the contract's exponential schedule
    (§2.9.3): **7 attempts** at 0 / 30s / 5min / 30min / 2h / 8h / 24h
    from initial dispatch. After the final attempt the notification moves
    to a **dead-letter** state — list with
    `GET /api/v1/merchant/webhooks/notifications?status=dead_lettered`
    and replay via the notifications surface.

    Webhook bodies are capped at **256 KB** (serialized, uncompressed).
    On the rare oversized payload, only `provider_response` is replaced
    by a truncated summary (`truncated: true`) whose `full_resource_url`
    serves the full snapshot — see the **Provider Snapshots** operations.

    ## Pagination

    List endpoints accept `limit` and `offset` query parameters. The
    response envelope is `{ count, <resource>_list }`. Default and
    maximum `limit` values vary per resource; see each endpoint.

    ## Errors

    Every 4xx/5xx response uses the shared `ApiErrorResponse` schema:
    `{ msg, data: null, provider_message? }`. `provider_message` is
    present only when the failure originated from an upstream provider,
    and forwards the provider's own error text verbatim.

    ## Environments

    The `servers` list below describes production, sandbox, and local
    environments. Override the server URL in your client or via the
    generated Postman / Bruno collections.
  contact:
    name: CrowdSplit Engineering
    url: https://github.com/oak-network/crowdsplit
  license:
    name: ISC
servers:
  - url: https://payments.oaknetwork.org
    description: Production
  - url: https://sandbox-payments.oaknetwork.org
    description: Sandbox
  - url: '{baseUrl}'
    description: Local development / self-hosted
    variables:
      baseUrl:
        default: http://localhost:3000
        description: Base URL of a locally running CrowdSplit instance
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: |
      Sign up, sign in, token refresh, password reset, and email
      verification. Obtain user-scoped `accessTokenAuth` JWTs here.
  - name: Merchants
    description: |
      Merchant profile, API-key management, merchant-token grant/refresh,
      and merchant-webhook registration/listing/toggling.
  - name: Customers
    description: |
      Create, update, list, and sync end-customers (subjects).
      Covers customer-level files and balances.
  - name: Payment Methods
    description: |
      Add, list, retrieve, and archive payment methods on a customer
      (card, PIX, bank account, wallet, etc.).
  - name: Provider Registration
    description: |
      KYC / provider-registration flow for a customer on each upstream
      provider, plus fetching the field schema and polling status.
  - name: Payments
    description: |
      Create payments, confirm / capture / cancel / refund. Supports
      card, PIX, and installment payments across providers.
  - name: Payouts
    description: Create outbound fiat payments to customer-owned accounts.
  - name: Transfers
    description: Move value between internal wallets.
  - name: Buy / Sell
    description: Stablecoin / fiat buy and sell flows.
  - name: Wallets
    description: Read wallet balances and trigger wallet trades.
  - name: Transactions
    description: Read transaction history, single transactions, and settle.
  - name: Disputes
    description: |
      Manage provider-originated disputes — upload evidence, submit,
      and close.
  - name: Subscriptions
    description: |
      Subscription plans and subscriber lifecycle, including recurring
      payment initiation (uses `refAppKeyAuth`).
  - name: Tax
    description: Calculate taxes for a given transaction shape.
  - name: Files
    description: Upload, list, retrieve, and delete merchant/customer files.
  - name: Generic
    description: |
      Proxy endpoint that forwards provider-specific calls whose shape
      varies by upstream provider.
  - name: Statuspage
    description: |
      CS Admin/Owner endpoints for managing Atlassian Statuspage scheduled
      maintenance windows. Incidents are managed automatically by the sync
      cron based on health probe transitions.
  - name: System
    description: Health check and service-metadata endpoints.
  - name: Webhooks
    description: |
      Manage the webhook URLs registered on a merchant (create, update,
      delete, toggle, and list).
  - name: Webhook Events
    description: |
      Reference list of every webhook event CrowdSplit can deliver to a
      merchant URL. See the root-level `Webhooks` section above for the
      envelope shape, delivery headers, retry policy, and signing scheme.
  - name: Provider Snapshots
    description: |
      Fetch the full untruncated `provider_response` for a specific resource
      version (§10h). Only for resolving webhook payloads truncated by the
      §2.9.3 256KB cap (`provider_response.truncated: true`) — follow the
      payload's `full_resource_url`. Not for routine snapshot access; use
      the per-resource GET endpoints for normal reads.
paths:
  /api/auth/signup:
    post:
      operationId: signup
      summary: User sign up
      description: Register a new user account with email and password. A verification email is sent upon successful registration.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: user@example.com
                password:
                  type: string
                  description: User's password
                  example: SecurePass123!
      responses:
        '200':
          description: User created successfully and verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: User Created Successfully!, Created email verification token!, Verification link emailed to user!, User Created Successfully!
                data: null
        '400':
          description: User already exists or email delivery failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/signup/verify-email:
    get:
      operationId: verifySignupEmail
      summary: Verify email address
      description: Verifies the user's email address using a token sent during signup.
      tags:
        - Auth
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: JWT verification token sent to the user's email
          schema:
            type: string
      responses:
        '200':
          description: Email verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: Email Verification Successful!
                data: null
        '400':
          description: Invalid or expired token, or email already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/auth/signup/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      summary: Resend verification email
      description: Resends the email verification link to the specified email address.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to resend verification to
                  example: user@example.com
      responses:
        '200':
          description: Verification email resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: Email Verification Token Updated!, Sent Verification Email!
                data: null
        '400':
          description: Email delivery failed or token error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/auth/signin:
    post:
      operationId: signin
      summary: Sign in
      description: Authenticate a user with email, password, and role. Returns JWT access and refresh tokens.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: user@example.com
                password:
                  type: string
                  description: User's password
                  example: SecurePass123!
                role:
                  type: string
                  description: Role to sign in as
                  enum:
                    - ROLE_ADMIN
                    - ROLE_PLATFORM_ADMIN
                    - ROLE_PLATFORM_USER
                  example: ROLE_PLATFORM_ADMIN
      responses:
        '200':
          description: Sign in successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      msg:
                        example: Sign In Successful!
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: User ID
                          email:
                            type: string
                            format: email
                          accessToken:
                            type: string
                            description: JWT access token
                          refreshToken:
                            type: string
                            description: JWT refresh token
                          createdMillis:
                            type: integer
                            description: User creation timestamp in milliseconds
        '400':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/token/refresh:
    post:
      operationId: refreshToken
      summary: Refresh access token
      description: Generate a new access token and refresh token using a valid refresh token.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: JWT refresh token obtained from sign in
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      msg:
                        example: Successfully Created New Refresh Token!
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                            description: New JWT access token
                          refreshToken:
                            type: string
                            description: New JWT refresh token
        '400':
          description: Refresh token expired or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/auth/token/validate:
    post:
      operationId: validateToken
      summary: Validate access token
      description: Check whether an access token is valid and not expired. Token can be passed via x-access-token header or query parameter.
      tags:
        - Auth
      security:
        - accessTokenAuth: []
      parameters:
        - name: x_access_token
          in: query
          required: false
          description: Access token (alternative to x-access-token header)
          schema:
            type: string
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      msg:
                        example: Token is Valid!
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: User ID associated with the token
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Request password reset
      description: Send a password reset link to the provided email address.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email address associated with the account
                  example: user@example.com
      responses:
        '200':
          description: Password reset link sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: Reset password link emailed to user!
                data: null
        '400':
          description: Email delivery failed or reset already requested recently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/reset-password/token-verify:
    get:
      operationId: verifyResetPasswordToken
      summary: Verify password reset token
      description: Check whether a password reset token is valid and not expired.
      tags:
        - Auth
      security: []
      parameters:
        - name: resetPasswordToken
          in: query
          required: true
          description: Reset password token sent to user's email
          schema:
            type: string
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: Token is Valid!
                data: null
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/auth/update-password:
    post:
      operationId: updatePassword
      summary: Update password
      description: Set a new password using a valid reset password token.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_password
                - reset_password_token
              properties:
                new_password:
                  type: string
                  description: The new password to set
                reset_password_token:
                  type: string
                  description: Reset password token from email
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                msg: Password Updated Successfully!
                data: null
        '400':
          description: Invalid token or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/signin/2fa:
    post:
      operationId: signin2fa
      summary: Complete sign-in with a 2FA code
      description: |
        Public endpoint. Exchange the short-lived 2FA challenge token returned by
        `POST /api/auth/signin` (when 2FA is enabled) plus a TOTP or backup code
        for a full session. The refresh token is also set as an HTTP-only cookie.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - twoFactorToken
                - code
              properties:
                twoFactorToken:
                  type: string
                  description: Challenge token from signin (tfaPending, 5m lifetime)
                code:
                  type: string
                  description: TOTP code or single-use backup code
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                          email:
                            type: string
                            format: email
                          roles:
                            type: array
                            items:
                              type: string
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          createdMillis:
                            type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Revoke the current session and clear the refresh-token cookie.
      tags:
        - Auth
      security:
        - accessTokenAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user
      description: |
        Return the authenticated user's profile, roles, 2FA state, and merchant
        link (including their per-merchant role, the source merchant-route
        authorization enforces — so clients derive what to show from the same
        truth the backend checks).
      tags:
        - Auth
      security:
        - accessTokenAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            description: User UID
                          email:
                            type: string
                            format: email
                          roles:
                            type: array
                            description: Global roles resolved from the database
                            items:
                              type: string
                          twoFactorEnabled:
                            type: boolean
                            description: Whether the user has completed TOTP enrollment
                          mfaSetupRequired:
                            type: boolean
                            description: |
                              True when this deployment requires the caller to enroll 2FA
                              before admin functions will work — i.e. MFA enforcement is on,
                              the caller holds a CS role, and they have not enrolled. Always
                              false for platform-side users, for enrolled CS staff, and where
                              enforcement is off. Clients use it to route to enrollment
                              instead of walking into a 403.

                              Point-in-time and scoped to the MFA gate: an admin 2FA reset can
                              flip it mid-session (the caller's access token outlives the
                              reset), and the admin IP allowlist can deny independently of it.
                              Treat it as a hint and still handle a 403 whose failure reason is
                              `mfa_required`.
                          merchant:
                            type: object
                            nullable: true
                            description: Merchant link, or null for CS staff with no merchant
                            properties:
                              id:
                                type: integer
                              role:
                                type: string
                                nullable: true
                                description: The caller's role on this merchant (merchant_users.role)
                              is_owner:
                                type: boolean
                                description: Whether the caller owns this merchant
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/auth/roles:
    get:
      operationId: listRoleCatalog
      summary: List the role catalog
      description: |
        Role metadata catalog — the canonical labels and descriptions for
        every CS and platform role, as rendered by dashboards. Static per
        backend version, so adding or renaming a role propagates without a
        frontend release.
      tags:
        - Auth
      security:
        - accessTokenAuth: []
      responses:
        '200':
          description: Role catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: string
                              description: Role identifier (e.g. ROLE_ADMIN)
                            scope:
                              type: string
                              enum:
                                - cs
                                - platform
                              description: Which side of the wire the role belongs to
                            label:
                              type: string
                              description: In-context display name
                            qualifiedLabel:
                              type: string
                              description: Disambiguated name for cross-side contexts
                            description:
                              type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/me/2fa/enroll:
    post:
      operationId: enroll2fa
      summary: Begin 2FA enrollment
      description: |
        Start TOTP enrollment and return the shared secret and otpauth URL.
        2FA is not active until confirmed via `POST /api/auth/me/2fa/confirm`.
      tags:
        - Auth
      security:
        - accessTokenAuth: []
      responses:
        '200':
          description: Enrollment started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          secret:
                            type: string
                            description: Base32 TOTP secret (shown once)
                          otpauthUrl:
                            type: string
                            description: otpauth:// URL for QR rendering
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: 2FA already enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/auth/me/2fa/confirm:
    post:
      operationId: confirm2fa
      summary: Confirm 2FA enrollment
      description: |
        Verify a TOTP code to activate 2FA and receive single-use backup codes
        (shown exactly once).
      tags:
        - Auth
      security:
        - accessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: TOTP code from the authenticator app
      responses:
        '200':
          description: 2FA activated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          backupCodes:
                            type: array
                            items:
                              type: string
        '400':
          description: No enrollment in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/me/2fa:
    delete:
      operationId: disable2fa
      summary: Disable 2FA
      description: |
        Disable 2FA after re-confirming the account password. Not permitted for
        the CS Owner.
      tags:
        - Auth
      security:
        - accessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      responses:
        '200':
          description: 2FA disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Owner must keep 2FA enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/step-up:
    post:
      operationId: stepUp
      summary: Obtain a step-up token
      description: |
        Re-authenticate with the account password (and TOTP code when 2FA is
        enabled) to obtain a short-lived step-up token for sensitive operations.
      tags:
        - Auth
      security:
        - accessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
