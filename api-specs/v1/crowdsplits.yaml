  /api/v1/transfer:
    post:
      operationId: createTransfer
      summary: Create a transfer
      description: |
        Initiate a transfer between accounts. Supports single-provider and inter-platform transfers.
        Fields provider, currency, payment_method.type are case-insensitive.
      tags:
        - Transfers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source
                - destination
              properties:
                provider:
                  type: string
                  description: Provider for single-provider transfers (case-insensitive)
                source:
                  type: object
                  description: Source account details
                  properties:
                    provider:
                      type: string
                      description: Source provider (for inter-platform transfers)
                    currency:
                      type: string
                    customer:
                      type: object
                      properties:
                        id:
                          $ref: '#/components/schemas/CustomerId'
                          description: Source customer ID (`cus_<uuid>` or bare UUID — both accepted)
                    amount:
                      type: integer
                      minimum: 1
                destination:
                  type: object
                  description: Destination account details
                  properties:
                    provider:
                      type: string
                      description: Destination provider (for inter-platform transfers)
                    customer:
                      type: object
                      properties:
                        id:
                          $ref: '#/components/schemas/CustomerId'
                          description: Destination customer ID (`cus_<uuid>` or bare UUID — both accepted)
                    payment_method:
                      type: object
                      description: Optional for single-provider (intra) Stripe transfers. When omitted, the payout is created without a Stripe destination, so Stripe pays the connected account's default external account for the payout currency; if the account holds no external account for that currency the transfer fails asynchronously via `transfer.failed`. A request that omits payment_method must carry no unrecognized fields at the top level or in `destination` (422 otherwise) — this keeps a misspelled payment_method key from being silently treated as an omission. When present, `id` and `type` are required and the payout is routed to that saved payment method.
                      properties:
                        type:
                          type: string
                        id:
                          $ref: '#/components/schemas/PaymentMethodId'
                          description: Destination payment method ID (`pm_<uuid>` or bare UUID — both accepted)
                        currency:
                          type: string
                        chain:
                          type: string
                metadata:
                  type: object
                  description: Custom metadata
                  additionalProperties: true
      responses:
        '200':
          description: Transfer initiated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Invalid request or platform error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
