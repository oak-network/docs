            - string
            - 'null'
          format: date-time
    DisputeResponse:
      type: object
      description: |
        Dispute record returned by GET /disputes, GET /disputes/:id.
        Shape reflects the runtime emission in
        `services/disputeService.getDisputeResponse` (:460); the
        associated `payment` is only present when the dispute has a
        linked transaction, and `merchant_uid` / `merchant_name` are only
        present on cross-merchant (CS console) reads.
      required:
        - id
        - status
        - evidences
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/DisputeId'
          description: Public dispute identifier.
        status:
          type: string
          description: Dispute lifecycle status.
        evidence_due_by:
          type:
            - string
            - 'null'
          description: |
            Deadline for submitting evidence, sourced from provider metadata
            (e.g. Stripe's `evidence_due_by`). Null when the provider has
            not communicated one.
        evidences:
          type: array
          description: Submitted evidence records for this dispute.
          items:
            type: object
            additionalProperties: true
        version:
          $ref: '#/components/schemas/ResourceVersion'
        created_at:
          type: string
          format: date-time
        payment:
          type: object
          description: |
            Snapshot of the payment this dispute is against, built via
            `transactionService.getTransactionInfoForResponse`. Same shape
            as a transaction detail read — includes `id`, `status`, `type`,
            `source`, `destination`, timestamps, and any provider response.
            Absent when the dispute has no linked transaction id.
          additionalProperties: true
          properties:
            id:
              $ref: '#/components/schemas/PaymentId'
        reference_transaction:
          type: object
          description: |
            Point-in-time snapshot of the disputed payment under the canonical
            nested reference key. Same value/shape as `payment`; emitted
            alongside it during migration. For live state call `GET /payments/{id}`.
          additionalProperties: true
          properties:
            id:
              $ref: '#/components/schemas/PaymentId'
        merchant_uid:
